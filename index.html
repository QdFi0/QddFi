// Built entirely in UTC (matching todayISO's UTC-based day string) and always

// day of a shorter month instead of silently rolling into the next one.
const nextOccurrence = (iso, frequency) => {
  const stepMonths = frequency === "Monthly" ? 1 : frequency === "Quarterly" ? 3 : frequency === "Semi-Annual" ? 6 : 12;
  const base = new Date(iso);
  if (isNaN(base.getTime())) return iso;
  const today = new Date(todayISO());
  const originalDay = base.getUTCDate();
  const startYear = base.getUTCFullYear();
  const startMonth = base.getUTCMonth();
  const build = monthsElapsed => {
    const targetMonthIndex = startMonth + monthsElapsed;
    const daysInTargetMonth = new Date(Date.UTC(startYear, targetMonthIndex + 1, 0)).getUTCDate();
    return new Date(Date.UTC(startYear, targetMonthIndex, Math.min(originalDay, daysInTargetMonth)));
  };
  let steps = 0;
  let d = build(0);
  let guard = 0;

    d = build(steps);

function computeDerived(record, assumptions, accounts) {

  const monthlyTakeHome = catTotal(record.income.primaryIncome);

  const base = {
    totalIncome,
    totalFixedNonFinancial,
    totalFixedFinancial,
    totalVariableGross,
    totalVariableExclBigTicket,
    totalExpenses,
    netCashflow,
    monthlyTakeHome,
    monthlySavings,
    annualTakeHome,
    hasBalances: !!record.balances

  const totalLiquidCash = sum(b.liquidCash);

  const investmentsByOwner = sumByOwner(b.investments, accounts && accounts.investments);
  const person1CpfTotal = sum(b.cpfPerson1);
  const person2CpfTotal = sum(b.cpfPerson2);
  const combinedCpf = person1CpfTotal + person2CpfTotal;

    key: "hdbValue",
    type: "asset"

    key: "hdbLoan",
    type: "liability",
    shortTermLiability: false
  }, {
    key: "carLoan",
    type: "liability",
    shortTermLiability: false

    key: "creditCard",
    type: "liability",
    shortTermLiability: true

  const totalShortTermLiabilities = propAccounts.filter(a => a.type === "liability" && a.shortTermLiability).reduce((s, a) => s + (Number((b.property || {})[a.key]) || 0), 0);

  const propertyEquityByOwner = (() => {
    const result = {
      Joint: 0

    propAccounts.forEach(a => {
      const v = Number((b.property || {})[a.key]) || 0;
      const owner = a.owner || "Joint";
      const signed = a.type === "liability" ? -v : v;

    key: `${group}.${a.key}`,

    ref: a.key,
    label: a.label,
    kind,
    owner: a.owner || "Joint",
    shortTermLiability: !!a.shortTermLiability
  });
  (accounts.liquidCash || []).forEach(a => push("liquidCash", a, "asset"));
  (accounts.investments || []).forEach(a => push("investments", a, "asset"));
  [["cpfPerson1", (familyMembers && familyMembers[0]) || "Person 1"], ["cpfPerson2", (familyMembers && familyMembers[1]) || "Person 2"]].forEach(([g, who]) =>
    ["oa", "sa", "ma"].forEach(s => out.push({
      key: `${g}.${s}`,
      group: g,
      ref: s,
      label: `CPF ${who} — ${s.toUpperCase()}`,
      kind: "asset",
      owner: who,
      shortTermLiability: false
    }))
  );
  (accounts.property || []).forEach(a =>
    push("property", a, a.type === "liability" ? "liability" : "asset")
  );
  return out;
};

const acctByKey = (registry, key) => registry.find(a => a.key === key);

// Entries pointing at an account that no longer exists. They are excluded from
// both balances and totals, so they need surfacing rather than silent dropping.
const orphanTxns = (registry, txns) => {
  const known = new Set((registry || []).map(a => a.key));
  return (txns || []).filter(t => !t.voided && t.account && !known.has(t.account));
};

// A transfer leg can point outside the tracked wallet entirely. It holds no
// balance, so computeBalances simply finds nothing for it and only moves the
// tracked side — money genuinely leaves or enters your tracked universe.
const EXTERNAL_KEY = "__external__";
const EXTERNAL_LABEL = "Outside of wallet";
const isExternal = k => k === EXTERNAL_KEY;
const acctLabel = (registry, key) => {
  if (isExternal(key)) return EXTERNAL_LABEL;
  const a = acctByKey(registry, key);
  return a ? a.label : "";
};

// Whether an entry counts as income, expense, or neither, for totals and for
// the monthly rollup. Transfers are always neutral. An adjustment is neutral
// unless you classified it against a real category (e.g. an investment gain
// booked to Interest / dividends), in which case it counts like the real thing.
const txnEffect = (t, categories) => {
  const NEUTRAL = { kind: "neutral", amount: 0 };
  if (!t || t.voided) return NEUTRAL;
  if (t.type === "income") return { kind: "income", amount: Number(t.amount) || 0 };
  if (t.type === "expense") return { kind: "expense", amount: Number(t.amount) || 0 };
  if (t.type === "adjustment") {
    const cat = t.category;
    if (!cat || cat === "balanceAdjustment") return NEUTRAL;
    const mag = Math.abs(Number(t.storedDelta) || 0);
    if ((categories.income || []).some(c => c.key === cat)) return { kind: "income", amount: mag };
    if ((categories.expense || []).some(c => c.key === cat)) return { kind: "expense", amount: mag };
  }
  return NEUTRAL;
};

// dir: +1 = money flows INTO this account, -1 = money flows OUT of it.
// For an asset, an inflow raises the stored number. For a liability the
// stored number is the magnitude of what's owed, so an inflow (a card
// payment, or a cashback credit) PAYS IT DOWN and lowers the number.
const storedDelta = (kind, dir, amount) =>
  (kind === "liability" ? -1 : 1) * dir * (Number(amount) || 0);

// asOf (inclusive ISO date) folds only transactions up to that date, so a
// month-end closing position can be derived instead of only "right now".
// Without it every historical rollup was stamped with today's balances.
const computeBalances = (registry, opening, txns, asOf) => {
  const bal = {};
  registry.forEach(a => { bal[a.key] = Number((opening || {})[a.key]) || 0; });
  (txns || []).forEach(t => {
    if (t.voided) return;
    if (asOf && t.date > asOf) return;
    if (t.type === "adjustment") {
      if (bal[t.account] !== undefined) bal[t.account] += Number(t.storedDelta) || 0;
      return;
    }
    const amt = Number(t.amount) || 0;
    const from = acctByKey(registry, t.account);
    if (t.type === "expense" && from) bal[t.account] += storedDelta(from.kind, -1, amt);
    if (t.type === "income" && from) bal[t.account] += storedDelta(from.kind, +1, amt);
    if (t.type === "transfer") {
      const to = acctByKey(registry, t.toAccount);
      if (from) bal[t.account] += storedDelta(from.kind, -1, amt);
      if (to) bal[t.toAccount] += storedDelta(to.kind, +1, amt);
    }
  });
  return bal;
};

// Seeds opening balances from an existing monthly record, so the historical
// snapshots you already have become the ledger's starting position.
const openingFromRecord = (record, registry) => {
  const out = {};
  registry.forEach(a => {
    const grp = ((record || {}).balances || {})[a.group] || {};
    out[a.key] = Number(grp[a.ref]) || 0;
  });
  return out;
};

const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// MONTH_ORDER is a fixed 2026-2029 list, so indexOf breaks outside it.
// This derives the same ordinal arithmetically and keeps working forever.
const monthSortKey = label => {
  const parts = String(label || "").split(" ");
  const mi = MONTH_ABBR.indexOf(parts[0]);
  const y = parseInt(parts[1], 10);
  if (mi < 0 || isNaN(y)) return Number.MAX_SAFE_INTEGER;
  return (y - 2026) * 12 + mi;
};
const monthLabelFromSortKey = k =>
  `${MONTH_ABBR[((k % 12) + 12) % 12]} ${2026 + Math.floor(k / 12)}`;
const monthStartISO = label => {
  const k = monthSortKey(label);
  if (k === Number.MAX_SAFE_INTEGER) return null;
  const y = 2026 + Math.floor(k / 12), mi = ((k % 12) + 12) % 12;
  return new Date(Date.UTC(y, mi, 1)).toISOString().slice(0, 10);
};
const monthEndISO = label => {
  const k = monthSortKey(label);
  if (k === Number.MAX_SAFE_INTEGER) return null;
  const y = 2026 + Math.floor(k / 12), mi = ((k % 12) + 12) % 12;
  return new Date(Date.UTC(y, mi + 1, 0)).toISOString().slice(0, 10);
};
const isoToMonthLabel = iso => {
  const [y, m] = (iso || "").split("-");
  return m ? `${MONTH_ABBR[parseInt(m, 10) - 1]} ${y}` : "";
};
const isoToDayLabel = iso => {
  const d = new Date(iso + "T00:00:00Z");
  if (isNaN(d.getTime())) return iso;
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()];
  return `${wd}, ${d.getUTCDate()} ${MONTH_ABBR[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
};
const startOfMonthISO = () => todayISO().slice(0, 8) + "01";
// Steps an ISO date forward by `interval` units (day/week/month/year), using
// UTC setters so local timezone offsets never shift the calendar date.
const addIntervalISO = (dateISO, interval, unit) => {
  const d = new Date((dateISO || todayISO()) + "T00:00:00Z");
  const n = Math.max(1, Math.round(Number(interval)) || 1);
  if (unit === "day") d.setUTCDate(d.getUTCDate() + n);
  else if (unit === "week") d.setUTCDate(d.getUTCDate() + n * 7);
  else if (unit === "year") d.setUTCFullYear(d.getUTCFullYear() + n);
  else d.setUTCMonth(d.getUTCMonth() + n);
  return d.toISOString().slice(0, 10);
};
// Walks one recurring-shaped item's cadence forward from nextDueDate, posting every
// occurrence <= today via saveTxn (buildTxn maps item+date -> a txn), and returns the
// item with nextDueDate/lastPostedDate advanced (or the same item if nothing was due).
// Shared by the Recurring and Insurance posting effects so the guard-loop/advance logic
// can't drift out of sync between them.
const postDueCadence = (item, today, saveTxn, buildTxn) => {
  if (!(Number(item.amount) > 0)) return item;
  let cursor = item.nextDueDate || today;
  let posted = false;
  for (let guard = 0; guard < 500 && cursor <= today; guard++) {
    saveTxn(buildTxn(item, cursor));
    cursor = addIntervalISO(cursor, item.interval, item.unit);
    posted = true;
  }
  return posted ? { ...item, nextDueDate: cursor, lastPostedDate: today } : item;
};
// Buckets each active item's amount into the forecast month it lands in, walking its
// cadence forward from nextDueDate (capped at lapseDate when present). Shared by the
// Recurring and Insurance forecast calculations so they can't disagree with the actual
// posting logic above about which months an item's amount lands in.
const bucketDueAmounts = (items, startKey) => {
  const byMonth = {};
  items.forEach(item => {
    if (item.active === false) return;
    const amt = Number(item.amount) || 0;
    if (!amt) return;
    let cursor = item.nextDueDate || todayISO();
    for (let guard = 0; guard < 60; guard++) {
      if (item.lapseDate && cursor > item.lapseDate) break;
      const monthKey = monthSortKey(isoToMonthLabel(cursor));
      if (monthKey > startKey + 11) break;
      if (monthKey >= startKey) byMonth[monthKey] = (byMonth[monthKey] || 0) + amt;
      cursor = addIntervalISO(cursor, item.interval, item.unit);
    }
  });
  return byMonth;
};
const monthsAgoISO = n => {
  const d = new Date(todayISO() + "T00:00:00Z");
  d.setUTCMonth(d.getUTCMonth() - n);
  return d.toISOString().slice(0, 10);
};

// Builds the monthly record shape the dashboard/budgets/forecast already read,
// entirely from the ledger. Income and expenses come from transactions dated
// inside the month; balances come from the position as at month-end. Nothing
// here is stored — it is recomputed from transactions on every render, so it
// can never drift from the ledger the way a hand-saved record could.
const deriveRecord = (monthLabel, registry, opening, txns, categories) => {
  const start = monthStartISO(monthLabel), end = monthEndISO(monthLabel);
  const activeExpense = (categories.expense || []).filter(c => !c.archived);
  const activeIncome = (categories.income || []).filter(c => !c.archived);
  const blank = cats => Object.fromEntries(cats.map(c => [c.key,
    c.subcats && c.subcats.length ? Object.fromEntries(c.subcats.map(s => [s.key, 0])) : 0]));
  const income = blank(activeIncome);
  const expenses = {
    fixedNonFinancial: blank(activeExpense.filter(c => c.group === "fixedNonFinancial")),
    fixedFinancial: blank(activeExpense.filter(c => c.group === "fixedFinancial")),
    variable: blank(activeExpense.filter(c => c.group === "variable"))
  };
  const add = (bucket, catKey, subKey, amt) => {
    if (!bucket || bucket[catKey] === undefined) return;
    if (bucket[catKey] && typeof bucket[catKey] === "object") {
      if (subKey && bucket[catKey][subKey] !== undefined) bucket[catKey][subKey] += amt;
      else {
        const first = Object.keys(bucket[catKey])[0];
        if (first) bucket[catKey][first] += amt;
      }
    } else bucket[catKey] += amt;
  };
  const known = new Set(registry.map(a => a.key));
  (txns || []).forEach(t => {
    if (t.voided || !t.date || t.date < start || t.date > end) return;
    // If the account was deleted the balance side is already dropped, so the
    // P&L side must be dropped too or the two statements disagree.
    if (!known.has(t.account)) return;
    const e = txnEffect(t, categories);
    if (e.kind === "income") add(income, t.category, t.subcat, e.amount);
    else if (e.kind === "expense") {
      const c = activeExpense.find(x => x.key === t.category);
      if (c) add(expenses[c.group], t.category, t.subcat, e.amount);
    }
  });
  const closing = computeBalances(registry, opening, txns, end);
  const balances = JSON.parse(JSON.stringify(BLANK_BALANCES));
  registry.forEach(a => {
    if (!balances[a.group]) balances[a.group] = {};
    balances[a.group][a.ref] = Math.round((closing[a.key] || 0) * 100) / 100;
  });
  return { month: monthLabel, income, expenses, balances, derived: true };
};

const downloadBlob = (content, filename, mime) => {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

const EXPORT_HEADERS = ["Date","Type","Amount","Account","To account","Category","Sub-category","Who","Payee","Note"];

const txnToRow = (t, registry, catLookup) => {
  const c = catLookup(t.category, t.subcat);
  return [
    t.date || "",
    t.type === "adjustment" ? "Balance adjustment" : (t.type || ""),
    t.type === "adjustment" ? (Number(t.storedDelta) || 0) : (Number(t.amount) || 0),
    acctLabel(registry, t.account),
    acctLabel(registry, t.toAccount),
    c.cat,
    c.sub,
    t.who || "",
    t.payee || "",
    t.note || ""
  ];
};

const exportCsv = (rows, filename) => {
  const esc = v => {
    const s = String(v == null ? "" : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [EXPORT_HEADERS, ...rows].map(r => r.map(esc).join(",")).join("\r\n");
  downloadBlob("\uFEFF" + csv, filename + ".csv", "text/csv;charset=utf-8;");
};

const exportXlsx = (rows, filename) => {
  if (typeof XLSX === "undefined") {
    alert("Excel export library didn't load — using CSV instead (opens fine in Excel).");
    exportCsv(rows, filename);
    return;
  }
  const ws = XLSX.utils.aoa_to_sheet([EXPORT_HEADERS, ...rows]);
  ws["!cols"] = [{wch:11},{wch:18},{wch:12},{wch:22},{wch:22},{wch:20},{wch:18},{wch:7},{wch:18},{wch:28}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Transactions");
  XLSX.writeFile(wb, filename + ".xlsx");
};

function ReconcileDialog({ account, computed, onCancel, onConfirm, categories }) {
  const [actual, setActual] = useState(computed);
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayISO());
  const [counterCat, setCounterCat] = useState("");
  const diff = Math.round(((Number(actual) || 0) - computed) * 100) / 100;
  // Which way the difference points decides which side of the books it
  // belongs on: an asset that grew, or a liability that shrank, is a gain.
  const favourable = account.kind === "liability" ? diff < 0 : diff > 0;
  const pool = ((favourable ? categories.income : categories.expense) || []).filter(c => !c.archived);
  return rc("div", {
    onClick: onCancel,
    style: {
      position: "fixed", inset: 0, background: "rgba(27,36,48,0.45)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1200
    }
  }, rc("div", {
    onClick: e => e.stopPropagation(),
    style: { background: "#fff", borderRadius: 10, padding: 22, width: 420, maxWidth: "92vw" }
  },
    rc("div", { style: { fontFamily: "var(--serif)", fontSize: 19, color: "var(--ink-1)", marginBottom: 4 } },
      "Adjust balance"),
    rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-3)", marginBottom: 16 } },
      account.label),
    rc("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 } },
      rc("div", null,
        rc(LedgerLabel, null, "Ledger says"),
        rc("div", { style: { fontFamily: "var(--mono)", fontSize: 15, color: "var(--ink-2)", padding: "7px 0" } },
          fmt(computed, 2))
      ),
      rc("div", null,
        rc(LedgerLabel, null, "Actual balance"),
        rc("input", {
          type: "number", step: "0.01", value: actual,
          onFocus: e => e.target.select(),
          onChange: e => setActual(e.target.value === "" ? 0 : parseFloat(e.target.value)),
          style: { ...inputStyle, fontFamily: "var(--mono)" }
        })
      )
    ),
    rc("div", { style: { marginBottom: 12 } },
      rc(LedgerLabel, null, "Date of adjustment"),
      rc("input", { type: "date", value: date, onChange: e => setDate(e.target.value), style: inputStyle })
    ),
    rc("div", { style: { marginBottom: 16 } },
      rc(LedgerLabel, null, "Reason (optional)"),
      rc("input", {
        type: "text", value: note, placeholder: "e.g. bank interest, missed entry",
        onChange: e => setNote(e.target.value), style: inputStyle
      })
    ),
    Math.abs(diff) >= 0.005 && rc("div", { style: { marginBottom: 16 } },
      rc(LedgerLabel, null, "Book the difference as"),
      rc("select", { value: counterCat, onChange: e => setCounterCat(e.target.value), style: inputStyle },
        rc("option", { value: "" }, "Unexplained \u2014 don't count it as income or spending"),
        rc("optgroup", { label: favourable ? "Count as income" : "Count as expense" },
          pool.map(c => rc("option", { key: c.key, value: c.key }, (c.icon ? c.icon + " " : "") + c.label)))),
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 11, color: "var(--ink-3)", marginTop: 4 } },
        favourable
          ? "Use this for investment gains, CPF interest or cashback so they show up as income."
          : "Use this for market losses or fees so they show up as spending.")),
    rc("div", {
      style: {
        background: Math.abs(diff) < 0.005 ? "#F3F2EE" : "#FBF3E6",
        border: "1px solid var(--hair)", borderRadius: 8, padding: 12, marginBottom: 16,
        fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-2)"
      }
    }, Math.abs(diff) < 0.005
      ? "No difference — nothing will be recorded."
      : `A ${diff > 0 ? "increase" : "decrease"} of ${fmt(Math.abs(diff), 2)} will be written to the ledger as a balance adjustment entry.`),
    rc("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end" } },

      rc("button", {
        className: "btn-primary",

        onClick: () => onConfirm({ storedDelta: diff, note, date, category: counterCat || "balanceAdjustment" })
      }, "Record adjustment")

  ));
}

// Recurring item editor card. Account/category drive the actual transaction
// posted when the item is due, so — unlike the old direction+frequency+
// dueMonth register — this needs the same fields the daily ledger does
// (account, category, who), plus a flexible "every N day/week/month/year"
// cadence instead of a fixed frequency dropdown.
function RecurringItemCard({ item, registry, categories, familyMembers, onUpdate, onRemove }) {
  const set = patch => onUpdate(item.id, patch);
  const isTransfer = item.type === "transfer";
  const catList = item.type === "income" ? categories.income : categories.expense;
  const canPost = !!item.account && (isTransfer ? !!item.toAccount : !!item.category) && Number(item.amount) > 0;
  const isPaused = item.active === false;
  const overdue = !isPaused && canPost && item.nextDueDate <= todayISO();

  const status = isPaused
    ? { label: "Paused", bg: "#F3F2EE", color: "var(--ink-3)" }
    : !canPost
    ? { label: "Incomplete — won't auto-post", bg: "#FBF3E6", color: "var(--amber)" }
    : overdue
    ? { label: "Posting on next visit", bg: "#FBEAF0", color: "var(--warn)" }
    : { label: `Next: ${isoToDayLabel(item.nextDueDate)}`, bg: "#E8F3EE", color: "var(--accent)" };

  const chip = (label, active, onClick, key) => rc("button", {
    key: key || label, onClick, className: active ? "btn-primary" : "btn-secondary",
    style: { padding: "5px 11px", fontSize: 12, borderRadius: 999 }
  }, label);

  return rc(Card, null,
    rc("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 } },
      rc("span", {
        style: {
          fontFamily: "var(--sans)", fontSize: 11, fontWeight: 600,
          padding: "3px 10px", borderRadius: 999, background: status.bg, color: status.color
        }
      }, status.label),
      rc("div", { style: { display: "flex", gap: 6 } },
        rc(IconBtn, { onClick: () => set({ active: isPaused }) }, isPaused ? "Resume" : "Pause"),
        rc(IconBtn, { onClick: () => onRemove(item.id) }, "Remove")
      )
    ),

    rc("div", { style: { display: "flex", gap: 6, marginBottom: 12 } },
      [["expense", "Expense"], ["income", "Income"], ["transfer", "Transfer"]].map(([v, l]) =>
        rc("button", {
          key: v,
          onClick: () => set({ type: v, category: "", subcat: "", toAccount: "", who: v === "income" ? item.who : "Joint" }),
          className: item.type === v ? "btn-primary" : "btn-secondary",
          style: { padding: "6px 14px", fontSize: 12.5 }
        }, l))),

    rc("div", { style: { display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 10, marginBottom: 10 } },
      rc(TextField, { label: "Name", value: item.name, onChange: v => set({ name: v }) }),

    rc("div", { style: { display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 10 } },
      rc("div", { style: { flex: "1 1 220px" } },
        rc(LedgerLabel, null, isTransfer ? "From account" : "Account"),
        rc(AccountSelect, { registry, value: item.account, onChange: v => set({ account: v }), allowExternal: isTransfer })),
      isTransfer
        ? rc("div", { style: { flex: "1 1 220px" } },
            rc(LedgerLabel, null, "To account"),
            rc(AccountSelect, { registry, value: item.toAccount, onChange: v => set({ toAccount: v }), placeholder: "Destination…", allowExternal: true }))

/* ───────────── main tab ───────────── */

function TransactionsTab({
  registry, txns, categories, familyMembers,
  onSave, onDelete, opening, onSetOpening,
  latestRecord, txnError, orphans
}) {
  const blank = {
    id: null, date: todayISO(), type: "expense", amount: "",
    account: "", toAccount: "", category: "", subcat: "",
    payee: "", note: "", who: "Joint"
  };
  const [form, setForm] = useState(blank);
  const [from, setFrom] = useState(monthsAgoISO(1));
  const [to, setTo] = useState(todayISO());
  const [filterAccount, setFilterAccount] = useState("");
  const [search, setSearch] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showDetails, setShowDetails] = useState(false);

  const set = patch => setForm(f => ({ ...f, ...patch }));
  const isTransfer = form.type === "transfer";
  const catList = form.type === "income" ? categories.income : categories.expense;
  // Pinned categories (set in Settings) surface first so the ones this
  // household uses most stay within thumb's reach of the top of the grid.
  const sortedCatList = [...catList.filter(c => !c.archived)]
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  const pressKey = k => {
    let cur = form.amount === "" ? "" : String(form.amount);
    if (k === "⌫") cur = cur.slice(0, -1);
    else if (k === ".") { if (!cur.includes(".")) cur = cur + "."; }
    else cur = cur + k;
    set({ amount: cur });
  };
  const chip = (label, active, onClick, key) => rc("button", {
    key: key || label,
    onClick,
    className: active ? "btn-primary" : "btn-secondary",
    style: { padding: "6px 12px", fontSize: 12.5, borderRadius: 999 }
  }, label);

  const catLookup = (catKey, subKey) => {
    const all = [...(categories.income || []), ...(categories.expense || [])];
    const c = all.find(x => x.key === catKey);
    if (!c) return { cat: catKey === "balanceAdjustment" ? "Balance adjustment" : (catKey || ""), sub: "" };
    const s = (c.subcats || []).find(x => x.key === subKey);
    return { cat: c.label, sub: s ? s.label : "" };
  };

  const bothExternal = isExternal(form.account) && isExternal(form.toAccount);
  const canSave = form.amount !== "" && Number(form.amount) > 0 && form.account &&
    (isTransfer
      ? form.toAccount && form.toAccount !== form.account && !bothExternal
      : !isExternal(form.account) && !!form.category);

  const submit = () => {
    if (!canSave) return;
    onSave({
      id: form.id || (Date.now().toString(36) + uid()),
      date: form.date,
      type: form.type,
      amount: Math.abs(Number(form.amount)) || 0,
      account: form.account,
      toAccount: isTransfer ? form.toAccount : null,
      category: isTransfer ? null : form.category,
      subcat: isTransfer ? null : (form.subcat || null),
      payee: form.payee || "",
      note: form.note || "",
      who: form.who || "",
      createdAt: form.createdAt || new Date().toISOString()
    });
    setForm({ ...blank, date: form.date, type: form.type, account: form.account, who: form.who });
    setShowDetails(false);
  };

  const inRange = (txns || []).filter(t => {
    if (t.date < from || t.date > to) return false;
    if (filterAccount && t.account !== filterAccount && t.toAccount !== filterAccount) return false;
    if (search) {
      const c = catLookup(t.category, t.subcat);
      const hay = `${t.payee} ${t.note} ${c.cat} ${c.sub}`.toLowerCase();
      if (!hay.includes(search.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || "").localeCompare(a.createdAt || ""));

  const totals = inRange.reduce((acc, t) => {
    const e = txnEffect(t, categories);
    if (e.kind === "income") acc.income += e.amount;
    if (e.kind === "expense") acc.expense += e.amount;
    return acc;
  }, { income: 0, expense: 0 });

  const byDay = [];

    const last = byDay[byDay.length - 1];
    if (last && last.date === t.date) last.items.push(t);
    else byDay.push({ date: t.date, items: [t] });

      onConfirm: () => { onDelete(confirmDelete.id); setConfirmDelete(null); },
      onCancel: () => setConfirmDelete(null)

  );

// Kept in sync with the allowlist in the Firestore rules. The rules are what
// actually enforce access; this exists only to give a clear message instead of
// a silent permission failure.
const ALLOWED_EMAILS = ["eng.teck.93@gmail.com", "siruchew@gmail.com"];
const normEmail = e => String(e || "").trim().toLowerCase();
const isAllowedEmail = e => ALLOWED_EMAILS.map(normEmail).indexOf(normEmail(e)) !== -1;

// Codes where a popup can't work but a full-page redirect still can: blocked
// popups, in-app browsers, strict privacy settings, COOP headers.
const POPUP_FALLBACK_CODES = [
  "auth/popup-blocked", "auth/cancelled-popup-request", "auth/internal-error",
  "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"
];

const describeAuthError = e => {
  if (!e || !e.code) return "";
  if (e.code === "auth/popup-closed-by-user") return "";
  if (e.code === "auth/popup-blocked")
    return "Your browser blocked the sign-in popup. Use the no-popup option below.";
  if (e.code === "auth/unauthorized-domain")
    return "This site's address isn't on Firebase's authorised domains list. Add the hostname shown below under Authentication \u2192 Settings \u2192 Authorised domains.";
  if (e.code === "auth/operation-not-allowed")
    return "Google sign-in isn't enabled in Firebase under Authentication \u2192 Sign-in method.";
  if (e.code === "auth/network-request-failed")
    return "Network problem reaching Google. Check your connection and retry.";
  return "Sign-in failed (" + e.code + ")";
};

function LoginGate({ children }) {
  const [user, setUser] = useState(undefined); // undefined = still checking
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    // Completes a redirect-based sign-in and surfaces anything that failed
    // during it. Without this a failed redirect just looks like nothing happened.
    auth.getRedirectResult().catch(e => setErr(describeAuthError(e)));
    const unsub = auth.onAuthStateChanged(u => setUser(u || null));
    return () => unsub();
  }, []);

  const notAllowed = !!user && !isAllowedEmail(user.email);

  const makeProvider = () => {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    return p;
  };

  const signInPopup = () => {
    setErr(""); setBusy(true);
    auth.signInWithPopup(makeProvider())
      .then(() => setBusy(false))
      .catch(e => {
        if (POPUP_FALLBACK_CODES.indexOf(e.code) !== -1) {
          return auth.signInWithRedirect(makeProvider());
        }
        setErr(describeAuthError(e));
        setBusy(false);
      });
  };

  const signInRedirect = () => {

  // Recurring items post real transactions on their due date instead of only
  // feeding the forecast. Self-limiting: once caught up, nextDueDate sits
  // past "today" so the next pass over the same items posts nothing and
  // writes nothing — no ref guard needed to stop it looping. Deterministic
  // transaction ids (rec_<itemId>_<dueDate>) mean two household members'
  // browsers racing to post the same occurrence just overwrite the same doc
  // instead of creating a duplicate entry.
  useEffect(() => {
    if (!householdName || !recurring.length) return;
    const today = todayISO();
    let changed = false;
    const nextRecurring = recurring.map(item => {
      if (item.active === false) return item;
      if (!item.account) return item;
      if (item.type === "transfer" ? !item.toAccount : !item.category) return item;
      const next = postDueCadence(item, today, saveTxn, (it, cursor) => ({
        id: `rec_${it.id}_${cursor}`,
        date: cursor,
        type: it.type,
        amount: Number(it.amount),
        account: it.account,
        toAccount: it.type === "transfer" ? it.toAccount : null,
        category: it.type === "transfer" ? null : it.category,
        subcat: it.type === "transfer" ? null : (it.subcat || null),
        payee: it.name || "",
        note: it.notes || "",
        who: it.type === "income" ? (it.who || "Joint") : "Joint",
        recurringId: it.id,
        createdAt: new Date().toISOString()
      }));
      if (next !== item) changed = true;
      return next;
    });
    if (changed) {
      setRecurring(nextRecurring);
      persistAll({ recurring: nextRecurring });
    }
  }, [householdName, recurring]);

  }, [householdName, policies]);

  const setOpeningFromLatest = () => {

  const addContract = () => setContracts([...contracts, {

  const updateContract = (id, patch) => {

  // Minimal seed — reconcilePolicies fills in every other field's default (including

  const addPolicy = () => setPolicies([...policies, {
    id: uid(),

    product: "",
    policyNumber: "",

  }]);
  const updatePolicy = (id, patch) => {
    const next = policies.map(p => p.id === id ? {
      ...p,

    } : p);

    persistAll({
      policies: next
    });
  };
  const togglePolicyLock = id => {
    const target = policies.find(p => p.id === id);
    if (!target) return;
    updatePolicy(id, {

    });
  };
  const removePolicy = id => {
    const next = policies.filter(p => p.id !== id);
    setPolicies(next);
    persistAll({
      policies: next
    });
  };
  // Early repayment, refinancing, and bank repricing are all, mechanically, "the schedule's
  // terms reset as of this date" — one events list on the loan covers all three (see
  // amortize(), which walks them in date order). `kind: "extraPayment"` just knocks money off
  // the balance; `kind: "rateChange"` covers refinance/repricing identically by recomputing
  // the payment. Pre-filling ratePct/tenureYears from the loan's current values means leaving
  // them untouched is a no-op change, not a jump to zero.
  const loanDocKey = loanKey => loanKey === "housing" ? "housingLoan" : "carLoan";
  const addLoanEvent = (loanKey, kind) => {
    const loan = loanKey === "housing" ? housingLoan : carLoan;

    const next = {

        notes: "", posted: false

    };

  const updateLoanEvent = (loanKey, eventId, patch) => {
    const loan = loanKey === "housing" ? housingLoan : carLoan;
    const setLoan = loanKey === "housing" ? setHousingLoan : setCarLoan;
    const next = {
      ...loan,

    };

    persistAll({ [loanDocKey(loanKey)]: next });

  const removeLoanEvent = (loanKey, eventId) => {
    const loan = loanKey === "housing" ? housingLoan : carLoan;
    const setLoan = loanKey === "housing" ? setHousingLoan : setCarLoan;
    const next = { ...loan, events: (loan.events || []).filter(e => e.id !== eventId) };

    persistAll({ [loanDocKey(loanKey)]: next });

  // Minimal seed — reconcileRecurring fills in every other field's default
  // (including active: false, since a blank item has no account/category yet
  // and so can't post) the moment this flows back through the `recurring` memo.
  const addRecurring = () => setRecurring([...recurring, {
    id: uid(),
    name: "",
    notes: ""
  }]);
  const updateRecurring = (id, patch) => {
    const next = recurring.map(r => r.id === id ? {
      ...r,

  const removeRecurring = id => {

  const addFamilyMember = () => {
    let name = "New member";
    let n = 1;
    while (familyMembers.includes(name)) {
      n += 1;
      name = `New member ${n}`;
    }
    const next = [...familyMembers, name];
    setFamilyMembers(next);
    persistAll({
      familyMembers: next
    });
  };
  const renameFamilyMember = (index, newName) => {
    const oldName = familyMembers[index];
    const next = familyMembers.map((f, i) => i === index ? newName : f);
    setFamilyMembers(next);
    const trimmed = (newName || "").trim();
    if (trimmed && trimmed !== oldName) {
      // Keep any policies already assigned to this person pointed at the
      // renamed value, instead of leaving them referencing a name that no
      // longer exists in the household member list.
      const nextPolicies = policies.map(p => p.person === oldName ? {
        ...p,
        person: trimmed
      } : p);
      setPolicies(nextPolicies);
      persistAll({
        familyMembers: next,
        policies: nextPolicies
      });

        familyMembers: next
      });
    }
  };
  const removeFamilyMember = index => {
    // Always keep at least one household member — the Insurance tab's
    // Person field and coverage table both assume the list isn't empty.
    if (familyMembers.length <= 1) return;
    // Removing by position (not by name) avoids accidentally deleting the
    // wrong entry — or both — if two members ever end up with the same name.
    const next = familyMembers.filter((f, i) => i !== index);
    setFamilyMembers(next);
    persistAll({
      familyMembers: next
    });
  };
  const setBudgetEntry = (key, patch) => {
    const next = {
      ...budgets,
      [key]: {
        ...normalizeBudget(budgets[key]),
        ...patch
      }
    };
    setBudgets(next);
    persistAll({
      budgets: next
    });
  };
  const removeBudget = key => {
    const next = {
      ...budgets
    };
    delete next[key];
    setBudgets(next);
    persistAll({
      budgets: next
    });
  };
  const addCategory = (type, label, groupOrCpfLinked) => {
    if (!label || !label.trim()) return;
    const key = `cat_${uid()}`;
    const item = type === "expense" ? {
      key,
      label: label.trim(),
      group: groupOrCpfLinked || "variable",
      color: "#5F5E5A",
      subcats: [],
      archived: false,
      core: false
    } : {
      key,
      label: label.trim(),
      subcats: [],
      archived: false,
      core: false,
      protected: false,
      cpfLinked: !!groupOrCpfLinked
    };
    const next = {
      ...categories,
      [type]: [...categories[type], item]
    };
    setCategories(next);
    persistAll({
      categories: next
    });
  };
  const updateCategory = (type, key, patch) => {
    const next = {
      ...categories,
      [type]: categories[type].map(c => c.key === key ? {
        ...c,
        ...patch
      } : c)
    };
    setCategories(next);
    persistAll({
      categories: next
    });
  };
  const removeCategory = (type, key) => {
    const next = {
      ...categories,
      [type]: categories[type].filter(c => c.key !== key)
    };
    setCategories(next);
    persistAll({
      categories: next
    });
  };
  const addSubcat = (type, catKey, label) => {
    if (!label || !label.trim()) return;
    const cat = categories[type].find(c => c.key === catKey);
    if (!cat) return;
    updateCategory(type, catKey, {
      subcats: [...(cat.subcats || []), {
        key: `sub_${uid()}`,
        label: label.trim()
      }]
    });
  };
  const removeSubcat = (type, catKey, subKey) => {
    const cat = categories[type].find(c => c.key === catKey);
    if (!cat) return;
    updateCategory(type, catKey, {
      subcats: (cat.subcats || []).filter(s => s.key !== subKey)
    });
  };
  const addAccount = (group, label) => {
    if (!label || !label.trim()) return;
    const item = {
      key: `acct_${uid()}`,
      label: label.trim()
    };
    if (group === "property") {
      item.type = "asset";
      item.shortTermLiability = false;
      item.owner = "Joint";
    }
    if (group === "liquidCash" || group === "investments") {
      item.owner = "Joint";
    }
    const next = {
      ...accounts,
      [group]: [...accounts[group], item]
    };
    setAccounts(next);
    persistAll({
      accounts: next
    });
  };
  const updateAccount = (group, key, patch) => {
    const next = {
      ...accounts,
      [group]: accounts[group].map(a => a.key === key ? {
        ...a,
        ...patch
      } : a)
    };
    setAccounts(next);
    persistAll({
      accounts: next
    });
  };
  const removeAccount = (group, key) => {
    const next = {
      ...accounts,
      [group]: accounts[group].filter(a => a.key !== key)
    };
    setAccounts(next);
    persistAll({
      accounts: next
    });
  };
  const dismissHint = key => persistAll({
    dismissedHints: {
      ...dismissedHints,
      [key]: true
    }
  });
  const addTaxAdhoc = () => persistAll({
    taxSettings: {
      ...taxSettings,
      adhoc: [...taxSettings.adhoc, {
        id: uid(),
        name: "",
        type: "relief",
        amount: 0
      }]
    }
  });
  const updateTaxAdhoc = (id, patch) => persistAll({
    taxSettings: {
      ...taxSettings,
      adhoc: taxSettings.adhoc.map(a => a.id === id ? {
        ...a,
        ...patch
      } : a)
    }
  });
  const removeTaxAdhoc = id => persistAll({
    taxSettings: {
      ...taxSettings,
      adhoc: taxSettings.adhoc.filter(a => a.id !== id)
    }
  });
  const cpfResult = useMemo(() => computeCpfContribution(cpfSettings.person1Age, cpfSettings.person1Salary, cpfSettings.person1BonusThisMonth, cpfSettings.person1AnnualOwToDate), [cpfSettings]);
  const cpfFinal = cpfSettings.person1ManualOverride ? {
    oaAmt: cpfSettings.person1ManualOA,
    saAmt: cpfSettings.person1ManualSA,
    maAmt: cpfSettings.person1ManualMA
  } : {
    oaAmt: cpfResult.oaAmt,
    saAmt: cpfResult.saAmt,
    maAmt: cpfResult.maAmt
  };
  const cpfResultPerson2 = useMemo(() => computeCpfContribution(cpfSettings.person2Age, cpfSettings.person2Salary, cpfSettings.person2BonusThisMonth, cpfSettings.person2AnnualOwToDate), [cpfSettings]);
  const cpfFinalPerson2 = cpfSettings.person2ManualOverride ? {
    oaAmt: cpfSettings.person2ManualOA,
    saAmt: cpfSettings.person2ManualSA,
    maAmt: cpfSettings.person2ManualMA
  } : {
    oaAmt: cpfResultPerson2.oaAmt,
    saAmt: cpfResultPerson2.saAmt,
    maAmt: cpfResultPerson2.maAmt
  };
  const taxResult = useMemo(() => {
    const cpfReliefAmt = taxSettings.includeCpfRelief ? Math.min(0.20 * Math.min(cpfSettings.person1Salary, CPF_OW_CEILING) * 12, 37740) : 0;
    const childRelief = taxSettings.numChildren * taxSettings.childReliefPerChild;
    const eir = earnedIncomeRelief(taxSettings.age);
    const adhocReliefs = taxSettings.adhoc.filter(a => a.type === "relief").reduce((a, r) => a + (Number(r.amount) || 0), 0);
    const adhocRebates = taxSettings.adhoc.filter(a => a.type === "rebate").reduce((a, r) => a + (Number(r.amount) || 0), 0);
    const totalReliefsUncapped = cpfReliefAmt + childRelief + eir + taxSettings.nsmanRelief + adhocReliefs;
    const totalReliefs = Math.min(totalReliefsUncapped, 80000);
    const chargeableIncome = Math.max(taxSettings.annualEmploymentIncome - totalReliefs, 0);
    const taxBeforeRebate = computeTax(chargeableIncome);
    const netTax = Math.max(taxBeforeRebate - adhocRebates, 0);
    return {
      cpfReliefAmt,
      childRelief,
      eir,
      adhocReliefs,
      totalReliefsUncapped,
      totalReliefs,
      chargeableIncome,
      taxBeforeRebate,
      adhocRebates,
      netTax,
      effectiveRate: taxSettings.annualEmploymentIncome ? netTax / taxSettings.annualEmploymentIncome : 0
    };
  }, [taxSettings, cpfSettings]);
  const housingAmort = useMemo(() => amortize(housingLoan), [housingLoan]);
  const carAmort = useMemo(() => amortize(carLoan), [carLoan]);
  const activeLoan = loanSub === "housing" ? housingLoan : carLoan;
  const activeAmort = loanSub === "housing" ? housingAmort : carAmort;
  const activeLoanKey = loanSub === "housing" ? "housingLoan" : "carLoan";

  // Loan repayments post as one flat expense (principal+interest together, no liability
  // account entry — the amortisation table's own Balance column is what shows the
  // outstanding-loan trajectory). Fixed monthly cadence, capped at amort.payoffDate so a
  // fully repaid loan self-stops. Extra/lump-sum repayment events also post their own one-off
  // transaction exactly once, guarded by event.posted the same way lastPostedDate guards the
  // regular cadence.
  useEffect(() => {
    if (!householdName) return;
    const today = todayISO();
    [["housing", housingLoan, setHousingLoan, housingAmort],
     ["car", carLoan, setCarLoan, carAmort]].forEach(([key, loan, setLoan, amort]) => {
      if (!loan.trackAsRecurring || !loan.account || !loan.category) return;
      let nextLoan = loan;
      let changed = false;
      if (amort.payment > 0) {
        const cappedToday = amort.payoffDate && amort.payoffDate < today ? amort.payoffDate : today;
        const asItem = { amount: amort.payment, nextDueDate: loan.nextDueDate || loan.startDate, interval: 1, unit: "month" };
        const posted = postDueCadence(asItem, cappedToday, saveTxn, (it, cursor) => ({
          id: `loan_${key}_${cursor}`,
          date: cursor,
          type: "expense",
          amount: amort.payment,
          account: loan.account,
          toAccount: null,
          category: loan.category,
          subcat: loan.subcat || null,
          payee: key === "housing" ? "Housing loan" : "Car loan",
          note: "",
          who: "Joint",
          loanKey: key,
          createdAt: new Date().toISOString()
        }));
        if (posted.nextDueDate !== asItem.nextDueDate) {
          nextLoan = { ...nextLoan, nextDueDate: posted.nextDueDate, lastPostedDate: today };
          changed = true;
        }
      }
      const nextEvents = (nextLoan.events || []).map(ev => {
        if (ev.kind !== "extraPayment" || ev.posted || ev.date > today) return ev;
        saveTxn({
          id: `loan_${key}_extra_${ev.id}`,
          date: ev.date,
          type: "expense",
          amount: Number(ev.amount) || 0,
          account: loan.account,
          toAccount: null,
          category: loan.category,
          subcat: loan.subcat || null,
          payee: (key === "housing" ? "Housing loan" : "Car loan") + " — extra repayment",
          note: ev.notes || "",
          who: "Joint",
          loanKey: key,
          createdAt: new Date().toISOString()
        });
        changed = true;
        return { ...ev, posted: true };
      });
      if (changed) {
        nextLoan = { ...nextLoan, events: nextEvents };
        setLoan(nextLoan);
        persistAll({ [key === "housing" ? "housingLoan" : "carLoan"]: nextLoan });
      }
    });
  }, [householdName, housingLoan, carLoan, housingAmort, carAmort]);

  const forecast = useMemo(() => {
    if (!records || records.length === 0) return [];
    // The in-progress month is only partly logged, so averaging it in drags
    // the baseline down for the whole 12-month projection. Complete months only,
    // falling back to whatever exists if the ledger has just started.
    const complete = records.filter(r => r.month !== currentMonthLabel);
    const baseline = complete.length ? complete.slice(-3) : records.slice(-3);
    // Was hardcoded to a fixed set of income category keys, which silently
    // produced NaN if any of those were renamed and ignored any category added.
    const avgIncome = baseline.reduce((a, r) =>
      a + computeDerived(r, assumptions, accounts).totalIncome, 0) / baseline.length;
    const avgExpense = baseline.reduce((a, r) =>
      a + computeDerived(r, assumptions, accounts).totalExpenses
        - catTotal(r.expenses.variable.bigTicket), 0) / baseline.length;
    const lastRec = records[records.length - 1];
    const lastDerived = derivedByMonth[lastRec.month];
    let cumNetWorth = lastDerived.hasBalances ? lastDerived.netWorth : 0;
    const startKey = monthSortKey(lastRec.month) + 1;
    // Which forecast months each active recurring item lands in, walking
    // forward from its next not-yet-posted occurrence. Replaces the old fixed
    // calendar-month/frequency check now that cadence is arbitrary (every N
    // days/weeks/months/years) — the posting effect above keeps nextDueDate
    // sitting at the next occurrence that hasn't hit the ledger yet, so this
    // and the actual posting can never double up or disagree.
    const recurByMonth = {};
    recurring.forEach(item => {
      if (item.active === false || item.type === "transfer") return;
      const amt = Number(item.amount) || 0;
      if (!amt) return;
      let cursor = item.nextDueDate || todayISO();
      for (let guard = 0; guard < 60; guard++) {
        const monthKey = monthSortKey(isoToMonthLabel(cursor));
        if (monthKey > startKey + 11) break;
        if (monthKey >= startKey) {
          const bucket = recurByMonth[monthKey] || { income: 0, expense: 0 };
          if (item.type === "income") bucket.income += amt; else bucket.expense += amt;
          recurByMonth[monthKey] = bucket;
        }
        cursor = addIntervalISO(cursor, item.interval, item.unit);
      }
    });
    // Same cadence-walk as recurByMonth above (via the shared bucketDueAmounts helper),
    // applied to insurance policies — replaces the old calendar-month/frequency guess so
    // this can never disagree with the policy posting effect about which months a premium
    // lands in. Capped at lapseDate inside the helper, so a lapsed policy stops contributing.
    const policyByMonth = bucketDueAmounts(policies.filter(p => p.account && p.category), startKey);
    // Same shared cadence-walk, applied to the two loans (each a single "item" rather than
    // an array) — a loan not opted into recurring tracking, or one already past payoffDate,
    // simply contributes nothing.
    const loanByMonth = bucketDueAmounts(
      [["housing", housingLoan, housingAmort], ["car", carLoan, carAmort]]
        .filter(([, loan, amort]) => loan.trackAsRecurring && loan.account && loan.category && amort.payment > 0)
        .map(([, loan, amort]) => ({
          active: true, amount: amort.payment, nextDueDate: loan.nextDueDate || loan.startDate,
          interval: 1, unit: "month", lapseDate: amort.payoffDate
        })),
      startKey
    );
    const rows = [];
    for (let i = 0; i < 12; i++) {
      const monthName = monthLabelFromSortKey(startKey + i);
      const recurBucket = recurByMonth[startKey + i] || { income: 0, expense: 0 };
      let recurExpense = recurBucket.expense + (policyByMonth[startKey + i] || 0) + (loanByMonth[startKey + i] || 0),
        recurIncome = recurBucket.income;
      contracts.forEach(c => {
        // Monthly amount is billed every month regardless of renewal
        // cadence, so it always counts as a planned monthly expense.
        const amt = Number(c.monthlyAmount) || 0;
        if (amt) recurExpense += amt;
      });
      const income = avgIncome + recurIncome;
      const expenses = avgExpense + recurExpense;
      const net = income - expenses;
      cumNetWorth += net;
      rows.push({
        month: monthName,
        monthShort: monthName.split(" ")[0],
        income: Math.round(income),
