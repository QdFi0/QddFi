    // both the household's existing categories and the not-yet-persisted plan output so
    // the preview shows real labels instead of opaque keys.
    const previewCatLookup = (catKey, subKey) => {
      const pool = [...categories.expense, ...categories.income, ...plan.newCategoriesByType.expense, ...plan.newCategoriesByType.income];
      const c = pool.find(x => x.key === catKey);
      if (!c) return { cat: catKey || "", sub: "" };
      const extraSubs = plan.categorySubAdditions[catKey] || [];
      const s = [...(c.subcats || []), ...extraSubs].find(x => x.key === subKey);
      return { cat: c.label, sub: s ? s.label : "" };
    };
    body = rc("div", null,
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 13, color: "var(--ink-1)", marginBottom: 4 } },
        `${plan.txnsToWrite.length} transaction${plan.txnsToWrite.length === 1 ? "" : "s"} will be imported`),
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12, color: "var(--ink-3)", marginBottom: 14 } },
        `${plan.skippedCount} skipped by your mapping, ${plan.unparseableCount} had an unreadable date.` +
        ((newAccountsN + newCategoriesN + newSubcatsN) > 0
          ? ` Will create ${newAccountsN} account(s), ${newCategoriesN} categor${newCategoriesN === 1 ? "y" : "ies"}, and ${newSubcatsN} subcategor${newSubcatsN === 1 ? "y" : "ies"}.`
          : "")),
      rc("div", { style: { maxHeight: 260, overflowY: "auto", border: "1px solid var(--hair)", borderRadius: 8, marginBottom: 16 } },
        rc("table", { style: { width: "100%", borderCollapse: "collapse", fontSize: 12 } },
          rc("thead", null, rc("tr", null,
            ["Date", "Type", "Amount", "Category", "Sub-category", "Note"].map(h =>
              rc("th", { key: h, style: { textAlign: "left", padding: "6px 8px", borderBottom: "1px solid var(--hair)", position: "sticky", top: 0, background: "#fff" } }, h)))),
          rc("tbody", null, previewRows.map((t, i) => {
            const cl = previewCatLookup(t.category, t.subcat);
            return rc("tr", { key: i },
              rc("td", { style: { padding: "4px 8px", fontFamily: "var(--mono)" } }, t.date),
              rc("td", { style: { padding: "4px 8px" } }, t.type + (t.credit ? " (credit)" : "")),
              rc("td", { style: { padding: "4px 8px", fontFamily: "var(--mono)" } }, t.amount.toFixed(2)),
              rc("td", { style: { padding: "4px 8px" } }, cl.cat),
              rc("td", { style: { padding: "4px 8px", color: "var(--ink-3)" } }, cl.sub),
              rc("td", { style: { padding: "4px 8px", color: "var(--ink-3)" } }, t.note));
          }))
        )),
      rc("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 16 } },
        rc("button", { className: "btn-secondary", disabled: busy, onClick: () => setStep("categories") }, "Back"),
        busy
          ? rc("div", { style: { flex: "1 1 auto", maxWidth: 280 } },
              rc("div", { style: { fontFamily: "var(--sans)", fontSize: 11.5, color: "var(--ink-3)", marginBottom: 4, textAlign: "right" } },
                `Importing ${importProgress} of ${plan.txnsToWrite.length}…`),
              rc("div", { style: { height: 8, borderRadius: 999, background: "var(--hair)", overflow: "hidden" } },
                rc("div", { style: {
                  height: "100%",
                  width: `${plan.txnsToWrite.length ? Math.round(importProgress / plan.txnsToWrite.length * 100) : 0}%`,
                  background: "var(--accent)",
                  transition: "width 150ms ease"
                } })))
          : rc("button", { className: "btn-primary", disabled: plan.txnsToWrite.length === 0, onClick: confirmImport },
              `Confirm import (${plan.txnsToWrite.length})`)));
  } else if (step === "balances") {
    const groupDefs = [["liquidCash", "Liquid cash"], ["investments", "Investments"], ["property", "Property & loans"]];
    // Mirrors App's own addAccount (Settings > Accounts) exactly — same default shape,
    // same asset-until-edited default for a new property account — just callable from
    // here too, via the same persistAll prop, so "Start fresh" isn't a dead end for a
    // household with zero accounts yet.
    const addAccountHere = group => {
      const label = (newAccountName[group] || "").trim();
      if (!label) return;
      const item = { key: `acct_${uid()}`, label, owner: "Joint" };
      if (group === "property") { item.type = "asset"; item.shortTermLiability = false; }
      persistAll({ accounts: { ...accounts, [group]: [...accounts[group], item] } });
      setNewAccountName(n => ({ ...n, [group]: "" }));
    };
    body = rc("div", null,
      importSummary && rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-2)", marginBottom: 14 } },
        `Imported ${importSummary.importedCount} transactions.`),
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-3)", marginBottom: 14, lineHeight: 1.5 } },
        "Enter what each account actually holds. Leave any blank to skip it — you can always adjust it later. For a liability (like a credit card), enter the amount currently owed as a positive number."),
      fieldRow("As of", rc("input", { type: "date", value: asOfDate, onChange: e => setAsOfDate(e.target.value), style: { ...inputStyle, width: 160 } })),
      groupDefs.map(([group, label]) => {
        const items = registry.filter(a => a.group === group);
        return rc("div", { key: group, style: { marginBottom: 16 } },
          rc("div", { style: { fontFamily: "var(--sans)", fontWeight: 600, fontSize: 13, marginBottom: 8 } }, label),
          !items.length && rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12, color: "var(--ink-3)", marginBottom: 8 } },
            "No accounts yet."),
          items.map(a => rc("div", { key: a.key, style: { display: "flex", gap: 10, alignItems: "center", marginBottom: 6 } },
            rc("div", { style: { flex: "1 1 200px", fontFamily: "var(--sans)", fontSize: 12.5 } },
              a.label, a.kind === "liability" && rc("span", { style: { color: "var(--ink-3)" } }, " (liability)")),
            rc("input", {
              type: "text", inputMode: "decimal", placeholder: "0.00",
              value: balanceInputs[a.key] || "",
              onFocus: e => e.target.select(),
              onChange: e => setBalanceInputs(bi => ({ ...bi, [a.key]: e.target.value.replace(/[^0-9.]/g, "") })),
              style: { ...inputStyle, width: 120, fontFamily: "var(--mono)", textAlign: "right" }
            }),
            (liveBalances[a.key] || 0) !== 0 && rc("span", { style: { fontFamily: "var(--sans)", fontSize: 11, color: "var(--ink-3)" } },
              `currently tracked: ${fmt(liveBalances[a.key] || 0)}`))),
          rc("div", { style: { display: "flex", gap: 8, alignItems: "center", marginTop: 6 } },
            rc("input", {
              type: "text",
              placeholder: `New ${label.toLowerCase()} account name`,
              value: newAccountName[group] || "",
              onChange: e => setNewAccountName(n => ({ ...n, [group]: e.target.value })),
              onKeyDown: e => { if (e.key === "Enter") addAccountHere(group); },
              style: { ...inputStyle, flex: "1 1 200px", fontSize: 12.5, padding: "5px 9px" }
            }),
            rc("button", {
              className: "btn-secondary",
              style: { padding: "5px 12px", fontSize: 12.5 },
              disabled: !(newAccountName[group] || "").trim(),
              onClick: () => addAccountHere(group)
            }, "+ Add account")));
      }),
      rc("div", { style: { display: "flex", justifyContent: "space-between", marginTop: 8 } },
        rc("button", { className: "btn-secondary", disabled: busy, onClick: onFinish }, "Skip this step"),
        rc("button", { className: "btn-primary", disabled: busy, onClick: finishSetup }, busy ? "Saving…" : "Finish")));
  }

  // A casing/whitespace-only collision (e.g. "Dining" vs "dining") between two category
  // or subcategory names found while building `plan` — never auto-merged, confirmed one
  // at a time here instead. Recording either answer into categoryCaseDecisions/
  // subcatCaseDecisions triggers `plan` to recompute, which then either merges or keeps
  // the row separate and surfaces the next pending collision, if any.
  const pcc = plan.pendingCaseConfirm;
  const answerCaseConfirm = decision => {
    const setDecisions = pcc.kind === "category" ? setCategoryCaseDecisions : setSubcatCaseDecisions;
    setDecisions(d => ({ ...d, [pcc.decisionKey]: decision }));
  };

  return rc(React.Fragment, null,
    rc("div", {
      onClick: onClose,
      style: {
        position: "fixed", inset: 0, background: "rgba(27,36,48,0.45)",
        display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1300, padding: 20
      }
    }, rc("div", {
      onClick: e => e.stopPropagation(),
      style: { background: "#fff", borderRadius: 12, padding: 24, width: 760, maxWidth: "95vw", maxHeight: "85vh", overflowY: "auto" }
    },
      rc("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 } },
        rc("div", { style: { fontFamily: "var(--serif)", fontSize: 15, color: "var(--ink-3)" } }, "First-time setup"),
        rc(IconBtn, { onClick: onClose }, "Close")),
      stepIndicator,
      body
    )),
    pcc && rc(ConfirmDialog, {
      zIndex: 1400,
      title: pcc.kind === "category" ? "Same category?" : "Same subcategory?",
      message: `You typed "${pcc.thisLabel}" — is this the same ${pcc.kind === "category" ? "category" : "subcategory"} as "${pcc.firstLabel}"?`,
      confirmLabel: "Yes, same",
      cancelLabel: "No, keep separate",
      onConfirm: () => answerCaseConfirm("merge"),
      onCancel: () => answerCaseConfirm("separate")
    })
  );
}

// Recurring item editor card. Account/category drive the actual transaction
// posted when the item is due, so — unlike the old direction+frequency+
// dueMonth register — this needs the same fields the daily ledger does
// (account, category, who), plus a flexible "every N day/week/month/year"
// cadence instead of a fixed frequency dropdown.
function RecurringItemCard({ item, registry, categories, familyMembers, onUpdate, onRemove }) {
  const set = patch => onUpdate(item.id, patch);
  const isTransfer = item.type === "transfer";
  const catList = item.type === "income" ? categories.income : categories.expense;
  const canPost = !!item.account && (isTransfer ? !!item.toAccount : !!item.category) && Number(item.amount) > 0;
  const lapsed = !!item.lapseDate && item.lapseDate < todayISO();
  // No Pause/Resume — an item is assumed live once it's complete (account +
  // category/toAccount + amount); give it an End date instead to stop it for good.
  const overdue = !lapsed && canPost && item.nextDueDate <= todayISO();

  const status = lapsed
    ? { label: "Ended", bg: "#F3F2EE", color: "var(--ink-3)" }
    : !canPost
    ? { label: "Incomplete — won't auto-post", bg: "#FBF3E6", color: "var(--amber)" }
    : overdue
    ? { label: "Posting on next visit", bg: "#FBEAF0", color: "var(--warn)" }
    : { label: `Next: ${isoToDayLabel(item.nextDueDate)}`, bg: "#E8F3EE", color: "var(--accent)" };
  // Same "get flagged before it lapses" nudge Contracts used to give (daysUntil, ≤30/≤60
  // color thresholds), reused here now that any Recurring item can carry an end date.
  const endFlag = (() => {
    if (!item.lapseDate || lapsed) return null;
    const days = daysUntil(item.lapseDate);
    const color = days <= 30 ? "var(--warn)" : days <= 60 ? "var(--amber)" : "var(--ink-3)";
    return { text: days === 0 ? "Ends today" : `Ends in ${days} day${days === 1 ? "" : "s"}`, color };
  })();

  const chip = (label, active, onClick, key) => rc("button", {
    key: key || label, onClick, className: active ? "btn-primary" : "btn-secondary",
    style: { padding: "5px 11px", fontSize: 12, borderRadius: 999 }
  }, label);

  const locked = !!item.locked;

  // Saved items collapse to the same compact row as the "From insurance"/"From loans"
  // rollups above, so a Recurring register with many items doesn't stay a wall of full
  // forms — only the item currently being added/edited is ever expanded.
  if (locked) {
    const catLabel = isTransfer ? "Transfer" : ((catList.find(c => c.key === item.category) || {}).label || "—");
    return rc("div", {
      style: {
        display: "flex", justifyContent: "space-between", alignItems: "center",
        padding: "10px 14px", background: "#FAF9F4", border: "1px solid var(--hair)",
        borderRadius: 8, gap: 10, flexWrap: "wrap"
      }
    },
      rc("div", { style: { minWidth: 0 } },
        rc("div", { style: { fontFamily: "var(--sans)", fontSize: 13, fontWeight: 600, color: "var(--ink-1)" } },
          item.name || "Untitled"),
        rc("div", { style: { fontFamily: "var(--sans)", fontSize: 11, color: "var(--ink-3)" } },
          catLabel)),
      rc("div", { style: { display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" } },
        rc("span", {
          style: {
            fontFamily: "var(--sans)", fontSize: 11, fontWeight: 600,
            padding: "3px 10px", borderRadius: 999, background: status.bg, color: status.color
          }
        }, status.label),
        rc("span", { style: { fontFamily: "var(--mono)", fontSize: 13, fontWeight: 600, color: "var(--ink-1)" } },
          `${fmt(item.amount)} / ${item.interval} ${RECUR_UNIT_LABELS[item.unit]}`),
        rc("button", {
          className: "btn-secondary", style: { padding: "5px 10px", fontSize: 12 },
          onClick: () => set({ locked: false })
        }, "Edit"),
        rc(IconBtn, { onClick: () => onRemove(item.id) }, "Remove")
      )
    );
  }

  return rc(Card, null,
    rc("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 } },
      rc("span", {
        style: {
          fontFamily: "var(--sans)", fontSize: 11, fontWeight: 600,
          padding: "3px 10px", borderRadius: 999, background: status.bg, color: status.color
        }
      }, status.label),
      rc("div", { style: { display: "flex", gap: 6 } },
        rc(IconBtn, { onClick: () => onRemove(item.id) }, "Remove")
      )
    ),

    rc("div", { style: { display: "flex", gap: 6, marginBottom: 12 } },
      [["expense", "Expense"], ["income", "Income"], ["transfer", "Transfer"]].map(([v, l]) =>
        rc("button", {
          key: v,
          onClick: () => set({ type: v, category: "", subcat: "", toAccount: "", who: v === "income" ? item.who : "Joint" }),
          className: item.type === v ? "btn-primary" : "btn-secondary",
          style: { padding: "6px 14px", fontSize: 12.5 }
        }, l))),

    rc("div", { style: { display: "grid", gridTemplateColumns: "repeat(2, minmax(0,1fr))", gap: 10, marginBottom: 10 } },
      rc(TextField, { label: "Name", value: item.name, onChange: v => set({ name: v }) }),
      rc(NumberField, { label: "Amount", value: item.amount, onChange: v => set({ amount: v }) })),

    rc("div", { style: { display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 10 } },
      rc("div", { style: { flex: "1 1 220px" } },
        rc(LedgerLabel, null, isTransfer ? "From account" : "Account"),
        rc(AccountSelect, { registry, value: item.account, onChange: v => set({ account: v }), allowExternal: isTransfer })),
      isTransfer
        ? rc("div", { style: { flex: "1 1 220px" } },
            rc(LedgerLabel, null, "To account"),
            rc(AccountSelect, { registry, value: item.toAccount, onChange: v => set({ toAccount: v }), placeholder: "Destination…", allowExternal: true }))
        : rc("div", { style: { flex: "1 1 220px" } },
            rc(LedgerLabel, null, "Category"),
            rc(LedgerCategorySelect, { cats: catList, value: item.category, subValue: item.subcat, onChange: (c, s) => set({ category: c, subcat: s }) }))
    ),

    item.type === "income" && rc("div", { style: { marginBottom: 10 } },
      rc(LedgerLabel, null, "Who"),
      rc("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } },
        [...(familyMembers || ["Person 1", "Person 2"]), "Joint"].map(m =>
          chip(m, item.who === m, () => set({ who: m }), m)))),

    rc("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 } },
      rc("div", null, rc(LedgerLabel, null, "Every"),
        rc("div", { style: { display: "flex", gap: 6 } },
          rc("input", {
            type: "number", min: 1, step: 1, value: item.interval,
            onFocus: e => e.target.select(),
            onChange: e => set({ interval: Math.max(1, Math.round(Number(e.target.value) || 1)) }),
            style: { ...inputStyle, width: 64, fontFamily: "var(--mono)" }
          }),
          rc("select", {
            value: item.unit, onChange: e => set({ unit: e.target.value }), style: inputStyle
          }, RECUR_UNITS.map(u => rc("option", { key: u, value: u }, RECUR_UNIT_LABELS[u]))))),
      rc("div", null, rc(LedgerLabel, null, "Next due date"),
        rc("input", { type: "date", value: item.nextDueDate, onChange: e => set({ nextDueDate: e.target.value }), style: inputStyle })),
      rc("div", null, rc(LedgerLabel, null, "End date"),
        rc("input", { type: "date", value: item.lapseDate || "", placeholder: "optional", onChange: e => set({ lapseDate: e.target.value }), style: inputStyle }))
    ),
    endFlag && rc("div", { style: { fontFamily: "var(--sans)", fontSize: 11.5, fontWeight: 600, color: endFlag.color, marginTop: -4, marginBottom: 10 } }, endFlag.text),

    rc("div", { style: { marginBottom: 12 } },
      rc(LedgerLabel, null, "Notes"),
      rc("input", { type: "text", value: item.notes, placeholder: "optional", onChange: e => set({ notes: e.target.value }), style: inputStyle })),

    rc("div", { style: { display: "flex", justifyContent: "flex-end" } },
      rc("button", {
        className: "btn-primary",
        disabled: !(item.name || "").trim(),
        onClick: () => set({ locked: true }),
        style: { padding: "6px 14px", fontSize: 12.5 }
      }, "Save"))
  );
}

/* ───────────── main tab ───────────── */

function TransactionsTab({
  registry, txns, categories, familyMembers,
  onSave, onDelete, txnError, orphans,
  dismissedHints, onDismissHint, onOpenSetupWizard
}) {
  const blank = {
    id: null, date: todayISO(), type: "expense", amount: "",
    account: "", toAccount: "", category: "", subcat: "",
    payee: "", note: "", who: "Joint"
  };
  const [form, setForm] = useState(blank);
  const [from, setFrom] = useState(monthsAgoISO(1));
  const [to, setTo] = useState(todayISO());
  const [filterAccount, setFilterAccount] = useState("");
  const [search, setSearch] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [showDetails, setShowDetails] = useState(false);

  const set = patch => setForm(f => ({ ...f, ...patch }));
  const isTransfer = form.type === "transfer";
  const catList = form.type === "income" ? categories.income : categories.expense;
  // Pinned categories (set in Settings) surface first so the ones this
  // household uses most stay within thumb's reach of the top of the grid.
  const sortedCatList = [...catList.filter(c => !c.archived)]
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  const pressKey = k => {
    let cur = form.amount === "" ? "" : String(form.amount);
    if (k === "⌫") cur = cur.slice(0, -1);
    else if (k === ".") { if (!cur.includes(".")) cur = cur + "."; }
    else cur = cur + k;
    set({ amount: cur });
  };
  const chip = (label, active, onClick, key) => rc("button", {
    key: key || label,
    onClick,
    className: active ? "btn-primary" : "btn-secondary",
    style: { padding: "6px 12px", fontSize: 12.5, borderRadius: 999 }
  }, label);

  const catLookup = (catKey, subKey) => {
    const all = [...(categories.income || []), ...(categories.expense || [])];
    const c = all.find(x => x.key === catKey);
    if (!c) return { cat: catKey === "balanceAdjustment" ? "Balance adjustment" : (catKey || ""), sub: "" };
    const s = (c.subcats || []).find(x => x.key === subKey);
    return { cat: c.label, sub: s ? s.label : "" };
  };

  const bothExternal = isExternal(form.account) && isExternal(form.toAccount);
  const canSave = form.amount !== "" && Number(form.amount) > 0 && form.account &&
    (isTransfer
      ? form.toAccount && form.toAccount !== form.account && !bothExternal
      : !isExternal(form.account) && !!form.category);

  const submit = () => {
    if (!canSave) return;
    onSave({
      id: form.id || (Date.now().toString(36) + uid()),
      date: form.date,
      type: form.type,
      amount: Math.abs(Number(form.amount)) || 0,
      account: form.account,
      toAccount: isTransfer ? form.toAccount : null,
      category: isTransfer ? null : form.category,
      subcat: isTransfer ? null : (form.subcat || null),
      payee: form.payee || "",
      note: form.note || "",
      who: form.who || "",
      createdAt: form.createdAt || new Date().toISOString()
    });
    setForm({ ...blank, date: form.date, type: form.type, account: form.account, who: form.who });
    setShowDetails(false);
  };

  const inRange = (txns || []).filter(t => {
    if (t.date < from || t.date > to) return false;
    if (filterAccount && t.account !== filterAccount && t.toAccount !== filterAccount) return false;
    if (search) {
      const c = catLookup(t.category, t.subcat);
      const hay = `${t.payee} ${t.note} ${c.cat} ${c.sub}`.toLowerCase();
      if (!hay.includes(search.toLowerCase())) return false;
    }
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || "").localeCompare(a.createdAt || ""));

  const totals = inRange.reduce((acc, t) => {
    const e = txnEffect(t, categories);
    if (e.kind === "income") acc.income += e.amount;
    if (e.kind === "expense") acc.expense += e.amount;
    return acc;
  }, { income: 0, expense: 0 });

  const byDay = [];
  inRange.forEach(t => {
    const last = byDay[byDay.length - 1];
    if (last && last.date === t.date) last.items.push(t);
    else byDay.push({ date: t.date, items: [t] });
  });

  const rows = () => inRange.map(t => txnToRow(t, registry, catLookup));
  const fname = `transactions_${from}_to_${to}`;

  return rc("div", { style: { marginTop: 20 } },

    txnError && rc(Card, { style: { marginBottom: 14, borderColor: "#A6402B", background: "#FBEAF0" } },
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "#A6402B" } }, txnError)),

    (orphans || []).length > 0 && rc(Card, { style: { marginBottom: 14, background: "#FBF3E6" } },
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-2)", lineHeight: 1.5 } },
        `${orphans.length} entr${orphans.length === 1 ? "y is" : "ies are"} pointing at an account that no longer exists. They are excluded from balances and from monthly totals. Re-create the account in Settings, or edit each entry onto a live account.`)),

    (txns || []).length === 0 && !(dismissedHints || {}).setupWizard && rc(Card, { style: { marginBottom: 14, background: "#EFF6F3" } },
      rc("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 } },
        rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-2)" } },
          "New here? Import your transaction history and set starting balances."),
        rc("div", { style: { display: "flex", gap: 8, flexShrink: 0 } },
          rc("button", { className: "btn-primary", style: { padding: "6px 12px", fontSize: 12.5 }, onClick: onOpenSetupWizard }, "Set up"),
          rc(IconBtn, { onClick: () => onDismissHint("setupWizard") }, "No thanks")))),
