function computeDerived(record, assumptions) {
  const totalIncome = sum(record.income);
  const totalFixedNonFinancial = sum(record.expenses.fixedNonFinancial);
  const totalFixedFinancial = sum(record.expenses.fixedFinancial);
  const totalVariableGross = sum(record.expenses.variable);
  const totalVariableExclBigTicket = totalVariableGross - (record.expenses.variable.bigTicket || 0);
  const totalExpenses = totalFixedNonFinancial + totalFixedFinancial + totalVariableGross;
  const netCashflow = totalIncome - totalExpenses;
  const monthlyTakeHome = record.income.payrollEt;
  const monthlySavings = monthlyTakeHome - totalExpenses;
  const annualTakeHome = monthlyTakeHome * 12;
  const base = {
    totalIncome,
    totalFixedNonFinancial,
    totalFixedFinancial,
    totalVariableGross,
    totalVariableExclBigTicket,
    totalExpenses,
    netCashflow,
    monthlyTakeHome,
    monthlySavings,
    annualTakeHome,
    hasBalances: !!record.balances
  };
  if (!record.balances) return base;
  const b = record.balances;
  const totalLiquidCash = sum(b.liquidCash);
  const totalInvestments = sum(b.investments);
  const etCpfTotal = sum(b.cpfEt);
  const syCpfTotal = sum(b.cpfSy);
  const combinedCpf = etCpfTotal + syCpfTotal;
  const totalLiabilities = b.property.hdbLoan + b.property.carLoan + b.property.creditCard;
  const propertyEquity = b.property.hdbValue - b.property.hdbLoan;
  const netWorth = totalLiquidCash + totalInvestments + combinedCpf + propertyEquity - b.property.carLoan - b.property.creditCard;
  const totalAssets = totalLiquidCash + totalInvestments + combinedCpf + b.property.hdbValue;
  const currentLiquidCashNetCC = totalLiquidCash - b.property.creditCard;
  const bufferProgress = currentLiquidCashNetCC / assumptions.emergencyBufferTarget;
  const bufferGap = Math.max(assumptions.emergencyBufferTarget - currentLiquidCashNetCC, 0);
  const ratios = {
    basicLiquidity: totalLiquidCash / totalExpenses,
    netLiquidity: currentLiquidCashNetCC / totalExpenses,
    liquidToNetWorth: totalLiquidCash / netWorth,
    savingsRatio: monthlySavings / assumptions.monthlyGrossIncome,
    debtToAsset: totalLiabilities / totalAssets,
    debtServicing: assumptions.carLoanRepayment / monthlyTakeHome,
    insPremiumLoad: assumptions.annualInsurancePremiums / annualTakeHome,
    insPremiumLoadExclEnd: assumptions.annualInsurancePremiumsExclEndowments / annualTakeHome,
    netInvestToNetWorth: totalInvestments / netWorth,
    coverageToIncome: assumptions.etLegacyCover / annualTakeHome
  };
  return {
    ...base,
    totalLiquidCash,
    totalInvestments,
    etCpfTotal,
    syCpfTotal,
    combinedCpf,
    totalLiabilities,
    propertyEquity,
    netWorth,
    totalAssets,
    currentLiquidCashNetCC,
    bufferProgress,
    bufferGap,
    ratios
  };
}
