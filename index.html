const INITIAL_RECORDS = [];
function computeDerived(record, assumptions, accounts) {
  const totalIncome = sum(record.income);
  const totalFixedNonFinancial = sum(record.expenses.fixedNonFinancial);
  const totalFixedFinancial = sum(record.expenses.fixedFinancial);
  const totalVariableGross = sum(record.expenses.variable);
  const totalVariableExclBigTicket = totalVariableGross - catTotal(record.expenses.variable.bigTicket);
  const totalExpenses = totalFixedNonFinancial + totalFixedFinancial + totalVariableGross;
  const netCashflow = totalIncome - totalExpenses;
  const monthlyTakeHome = catTotal(record.income.primaryIncome);
  const monthlySavings = monthlyTakeHome - totalExpenses;
  const annualTakeHome = monthlyTakeHome * 12;
  const base = {
    totalIncome,
    totalFixedNonFinancial,
    totalFixedFinancial,
    totalVariableGross,
    totalVariableExclBigTicket,
    totalExpenses,
    netCashflow,
    monthlyTakeHome,
    monthlySavings,
    annualTakeHome,
    hasBalances: !!record.balances
  };
  if (!record.balances) return base;
  const b = record.balances;
  const totalLiquidCash = sum(b.liquidCash);
  const totalInvestments = sum(b.investments);
  const liquidCashByOwner = sumByOwner(b.liquidCash, accounts && accounts.liquidCash);
  const investmentsByOwner = sumByOwner(b.investments, accounts && accounts.investments);
  const person1CpfTotal = sum(b.cpfPerson1);
  const person2CpfTotal = sum(b.cpfPerson2);
  const combinedCpf = person1CpfTotal + person2CpfTotal;
  const propAccounts = accounts && accounts.property && accounts.property.length ? accounts.property : [{
    key: "hdbValue",
    type: "asset"
  }, {
    key: "hdbLoan",
    type: "liability",
    shortTermLiability: false,
    mortgage: true
  }, {
    key: "carLoan",
    type: "liability",
    shortTermLiability: false,
    mortgage: false
  }, {
    key: "creditCard",
    type: "liability",
    shortTermLiability: true,
    mortgage: false
  }];
  const totalPropertyAssets = propAccounts.filter(a => a.type === "asset").reduce((s, a) => s + (Number((b.property || {})[a.key]) || 0), 0);
  const totalLiabilities = propAccounts.filter(a => a.type === "liability").reduce((s, a) => s + (Number((b.property || {})[a.key]) || 0), 0);
  const totalShortTermLiabilities = propAccounts.filter(a => a.type === "liability" && a.shortTermLiability).reduce((s, a) => s + (Number((b.property || {})[a.key]) || 0), 0);

  // property-group liability account) — car loans, credit cards, and any other liability
  // parked in the same "Property & loans" account group are real debt too, but netting them
  // into a KPI literally named "Property equity" reads as if the home itself were underwater.
  // They're broken out into otherLiabilities/otherLiabilitiesByOwner instead so nothing is
  // silently dropped from the balance sheet — netWorth (below) still nets ALL of totalLiabilities,
  // unaffected by this split.
  const mortgageLiabilities = propAccounts.filter(a => a.type === "liability" && a.mortgage).reduce((s, a) => s + (Number((b.property || {})[a.key]) || 0), 0);

    const result = {
      Joint: 0

      if (a.type === "liability" && !a.mortgage) return;
      const v = Number((b.property || {})[a.key]) || 0;
      const owner = a.owner || "Joint";
      const signed = a.type === "liability" ? -v : v;
      result[owner] = (result[owner] || 0) + signed;

    return result;

    const result = {
      Joint: 0

    propAccounts.forEach(a => {
      if (a.type !== "liability" || a.mortgage) return;
      const v = Number((b.property || {})[a.key]) || 0;

      result[owner] = (result[owner] || 0) - v;

  const bufferGap = Math.max(assumptions.emergencyBufferTarget - currentLiquidCashNetCC, 0);

    debtToAsset: safeDiv(totalLiabilities, totalAssets),
    debtServicing: safeDiv(assumptions.carLoanRepayment, monthlyTakeHome),
    insPremiumLoad: safeDiv(assumptions.annualInsurancePremiums, annualTakeHome),
    insPremiumLoadExclEnd: safeDiv(assumptions.annualInsurancePremiumsExclEndowments, annualTakeHome),
    netInvestToNetWorth: safeDiv(totalInvestments, netWorth),
    coverageToIncome: safeDiv(assumptions.person1LegacyCover, annualTakeHome)

    ...base,
    totalLiquidCash,
    totalInvestments,
    liquidCashByOwner,
    investmentsByOwner,
    person1CpfTotal,
    person2CpfTotal,
    combinedCpf,
    totalLiabilities,
    propertyEquity,
    propertyEquityByOwner,
    otherLiabilities,

/* ─── Household financial metrics (metrics-spec.md) ───
   Pure functions, no React/Firestore dependency — each returns
   { value, status, inputs_used, warnings } so the UI can render badges
   and explain itself. Callers (the dashboardMetrics memo in App) are
   responsible for assembling the plain-data inputs from live state. */
function emergencyFundRatio(liquidAssets, monthlyExpensesSeries) {
  if (!monthlyExpensesSeries || monthlyExpensesSeries.length < 3) {
    return { value: null, status: "insufficient_data", inputs_used: { liquidAssets }, warnings: ["Need at least 3 months of transaction history"] };
  }
  const windows = [];
  for (let i = 0; i <= monthlyExpensesSeries.length - 3; i++) {
    const s = monthlyExpensesSeries[i].total + monthlyExpensesSeries[i + 1].total + monthlyExpensesSeries[i + 2].total;
    windows.push(s / 3);
  }
  const worstCaseMonthlySpend = Math.max(...windows);
  const value = safeDiv(liquidAssets, worstCaseMonthlySpend);
  return {
    value,
    status: value >= 6 ? "healthy" : value >= 3 ? "adequate" : "low",
    inputs_used: { liquidAssets, worstCaseMonthlySpend, windowCount: windows.length },
    warnings: monthlyExpensesSeries.length < 12 ? ["Less than 12 months of history — worst-case window may understate true risk"] : []
  };
}
function debtToIncome(monthlyDebtPayments, grossMonthlyIncome) {
  const housingDebt = monthlyDebtPayments.filter(d => d.category === "mortgage").reduce((a, d) => a + d.amount, 0);
  const totalDebt = monthlyDebtPayments.reduce((a, d) => a + d.amount, 0);
  if (grossMonthlyIncome <= 0) {
    return {
      housingDTI: { value: null, status: "no_income_data" },
      totalDTI: { value: null, status: "no_income_data" },
      inputs_used: { housingDebt, totalDebt, grossMonthlyIncome },
      warnings: ["No gross income recorded"]
    };
  }
  const housingDTI = housingDebt / grossMonthlyIncome;
  const totalDTI = totalDebt / grossMonthlyIncome;
  return {
    housingDTI: { value: housingDTI, status: housingDTI <= 0.30 ? "healthy" : housingDTI <= 0.35 ? "caution" : "high" },
    totalDTI: { value: totalDTI, status: totalDTI <= 0.40 ? "healthy" : totalDTI <= 0.55 ? "caution" : "high" },
    inputs_used: { housingDebt, totalDebt, grossMonthlyIncome },
    warnings: []
  };
}
function debtToAssetRatio(totalLiabilities, totalAssets) {
  if (totalAssets <= 0) return { value: null, status: "no_asset_data", inputs_used: { totalLiabilities, totalAssets }, warnings: [] };
  const value = totalLiabilities / totalAssets;
  return { value, status: value <= 0.4 ? "healthy" : value <= 0.6 ? "caution" : "high", inputs_used: { totalLiabilities, totalAssets }, warnings: [] };
}
function lifeCoverageRatio(totalLifeSumAssured, annualGrossIncome) {
  if (annualGrossIncome <= 0) return { value: null, status: "no_income_data", inputs_used: { totalLifeSumAssured, annualGrossIncome }, warnings: [] };
  const value = totalLifeSumAssured / annualGrossIncome;
  // Healthy threshold pegged to LIA Singapore's published 9x-annual-income
  // recommendation for Death & TPD coverage, not an arbitrary round number.
  return { value, status: value >= 9 ? "healthy" : value >= 4.5 ? "adequate" : "low", inputs_used: { totalLifeSumAssured, annualGrossIncome }, warnings: [] };
}
function incomeReplacementGap(outstandingDebt, dependentSupportYears, annualEssentialExpenses, existingLifeCoverage, liquidAssets) {
  const futureNeed = dependentSupportYears * annualEssentialExpenses;
  const totalNeed = outstandingDebt + futureNeed;
  const totalCovered = existingLifeCoverage + liquidAssets;
  const gap = totalNeed - totalCovered;
  return {
    value: gap,
    status: gap <= 0 ? "covered" : gap <= totalNeed * 0.25 ? "minor_gap" : "significant_gap",
    inputs_used: { outstandingDebt, futureNeed, existingLifeCoverage, liquidAssets, dependentSupportYears },
    warnings: []
  };
}
function insuranceCostRatio(protectionPremiums, grossMonthlyIncome) {
  if (grossMonthlyIncome <= 0) return { value: null, status: "no_income_data", inputs_used: { protectionPremiums, grossMonthlyIncome }, warnings: [] };
  const value = protectionPremiums / grossMonthlyIncome;
  return { value, status: value <= 0.10 ? "healthy" : value <= 0.15 ? "caution" : "high", inputs_used: { protectionPremiums, grossMonthlyIncome }, warnings: [] };

function savingsRate(totalIncome, totalExpenses, cpfContribution, includeCPF) {
  if (totalIncome <= 0) return { value: null, status: "no_income_data", inputs_used: {}, warnings: [] };
  const cashSaved = totalIncome - totalExpenses;
  const effectiveSaved = includeCPF ? cashSaved + cpfContribution : cashSaved;

/* ══════════════════════════════════════════════════════════════════
   TRANSACTION LEDGER
   Daily double-entry style ledger. Balances are DERIVED here:
   balance = opening balance + Σ of every posted transaction.
   Transactions live in their own Firestore subcollection (one doc
   each) so both household members can write concurrently without the
   whole-document overwrite in persistAll clobbering each other.

const rc = React.createElement;

const ACCOUNT_GROUP_LABELS = {
  liquidCash: "Liquid cash",
  investments: "Investments",
  cpfPerson1: "CPF",
  cpfPerson2: "CPF",
  property: "Property & loans"
};

// Flattens the grouped `accounts` state (plus the CPF sub-accounts, which
// live only inside balances and have no entry in `accounts`) into one flat,
// addressable list. Key format is "group.ref" so it maps straight back into
// the existing record.balances shape. familyMembers[0]/[1] name the two CPF
// profiles (employed / self-employed) — falls back to generic placeholders
// if the household hasn't named anyone yet.
const buildRegistry = (accounts, familyMembers) => {
  const out = [];
  const push = (group, a, kind) => out.push({
    key: `${group}.${a.key}`,
    group,
    ref: a.key,
    label: a.label,
    kind,
    owner: a.owner || "Joint",
    shortTermLiability: !!a.shortTermLiability

  (accounts.investments || []).forEach(a => push("investments", a, "asset"));

    ["oa", "sa", "ma"].forEach(s => out.push({
      key: `${g}.${s}`,
      group: g,
      ref: s,
      label: `CPF ${who} — ${s.toUpperCase()}`,
      kind: "asset",
      owner: who,
      shortTermLiability: false
    }))
  );
  (accounts.property || []).forEach(a =>
    push("property", a, a.type === "liability" ? "liability" : "asset")

const acctByKey = (registry, key) => registry.find(a => a.key === key);

// both balances and totals, so they need surfacing rather than silent dropping.
const orphanTxns = (registry, txns) => {
  const known = new Set((registry || []).map(a => a.key));
  return (txns || []).filter(t => !t.voided && t.account && !known.has(t.account));

// A transfer leg can point outside the tracked wallet entirely. It holds no
// balance, so computeBalances simply finds nothing for it and only moves the
// tracked side — money genuinely leaves or enters your tracked universe.
const EXTERNAL_KEY = "__external__";
const EXTERNAL_LABEL = "Outside of wallet";
const isExternal = k => k === EXTERNAL_KEY;
const acctLabel = (registry, key) => {
  if (isExternal(key)) return EXTERNAL_LABEL;
  const a = acctByKey(registry, key);

  const NEUTRAL = { kind: "neutral", amount: 0 };

  // other way — e.g. a refund the source file flagged as income, mapped onto an expense

    if (t.type === "income" && from) bal[t.account] += storedDelta(from.kind, t.credit ? -1 : +1, amt);
    if (t.type === "transfer") {
      const to = acctByKey(registry, t.toAccount);
      if (from) bal[t.account] += storedDelta(from.kind, -1, amt);
      if (to) bal[t.toAccount] += storedDelta(to.kind, +1, amt);
    }
  });
  return bal;
};

const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// Deliberately arithmetic, not a lookup against a fixed list of "Mon YYYY" strings —
// a fixed list would need extending every few years; this keeps working forever.
const monthSortKey = label => {
  const parts = String(label || "").split(" ");
  const mi = MONTH_ABBR.indexOf(parts[0]);
  const y = parseInt(parts[1], 10);
  if (mi < 0 || isNaN(y)) return Number.MAX_SAFE_INTEGER;
  return (y - 2026) * 12 + mi;
};
const monthLabelFromSortKey = k =>
  `${MONTH_ABBR[((k % 12) + 12) % 12]} ${2026 + Math.floor(k / 12)}`;
const monthStartISO = label => {
  const k = monthSortKey(label);
  if (k === Number.MAX_SAFE_INTEGER) return null;
  const y = 2026 + Math.floor(k / 12), mi = ((k % 12) + 12) % 12;
  return new Date(Date.UTC(y, mi, 1)).toISOString().slice(0, 10);
};
const monthEndISO = label => {
  const k = monthSortKey(label);
  if (k === Number.MAX_SAFE_INTEGER) return null;
  const y = 2026 + Math.floor(k / 12), mi = ((k % 12) + 12) % 12;
  return new Date(Date.UTC(y, mi + 1, 0)).toISOString().slice(0, 10);
};
const isoToMonthLabel = iso => {
  const [y, m] = (iso || "").split("-");
  return m ? `${MONTH_ABBR[parseInt(m, 10) - 1]} ${y}` : "";
};
const isoToDayLabel = iso => {
  const d = new Date(iso + "T00:00:00Z");
  if (isNaN(d.getTime())) return iso;
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()];
  return `${wd}, ${d.getUTCDate()} ${MONTH_ABBR[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
};
const startOfMonthISO = () => todayISO().slice(0, 8) + "01";
// Steps an ISO date forward by `interval` units (day/week/month/year), using
// UTC setters so local timezone offsets never shift the calendar date.
const addIntervalISO = (dateISO, interval, unit) => {
  const d = new Date((dateISO || todayISO()) + "T00:00:00Z");
  const n = Math.max(1, Math.round(Number(interval)) || 1);
  if (unit === "day") d.setUTCDate(d.getUTCDate() + n);
  else if (unit === "week") d.setUTCDate(d.getUTCDate() + n * 7);
  else if (unit === "year") d.setUTCFullYear(d.getUTCFullYear() + n);
  else d.setUTCMonth(d.getUTCMonth() + n);
  return d.toISOString().slice(0, 10);
};
// Walks one recurring-shaped item's cadence forward from nextDueDate, posting every
// occurrence <= today via saveTxn (buildTxn maps item+date -> a txn), and returns the
// item with nextDueDate/lastPostedDate advanced (or the same item if nothing was due).
// Shared by the Recurring and Insurance posting effects so the guard-loop/advance logic
// can't drift out of sync between them.
const postDueCadence = (item, today, saveTxn, buildTxn) => {
  if (!(Number(item.amount) > 0)) return item;
  let cursor = item.nextDueDate || today;
  let posted = false;
  for (let guard = 0; guard < 500 && cursor <= today; guard++) {
    saveTxn(buildTxn(item, cursor));
    cursor = addIntervalISO(cursor, item.interval, item.unit);
    posted = true;
  }
  return posted ? { ...item, nextDueDate: cursor, lastPostedDate: today } : item;
};
// Buckets each active item's amount into the forecast month it lands in, walking its
// cadence forward from nextDueDate (capped at lapseDate when present). Shared by the
// Recurring and Insurance forecast calculations so they can't disagree with the actual
// posting logic above about which months an item's amount lands in.
const bucketDueAmounts = (items, startKey) => {
  const byMonth = {};
  items.forEach(item => {
    if (item.active === false) return;
    const amt = Number(item.amount) || 0;
    if (!amt) return;
    let cursor = item.nextDueDate || todayISO();
    for (let guard = 0; guard < 60; guard++) {
      if (item.lapseDate && cursor > item.lapseDate) break;
      const monthKey = monthSortKey(isoToMonthLabel(cursor));
      if (monthKey > startKey + 11) break;
      if (monthKey >= startKey) byMonth[monthKey] = (byMonth[monthKey] || 0) + amt;
      cursor = addIntervalISO(cursor, item.interval, item.unit);
    }
  });
  return byMonth;
};
const monthsAgoISO = n => {
  const d = new Date(todayISO() + "T00:00:00Z");
  d.setUTCMonth(d.getUTCMonth() - n);
  return d.toISOString().slice(0, 10);
};

// Builds the monthly record shape the dashboard/budgets/forecast already read,
// entirely from the ledger. Income and expenses come from transactions dated
// inside the month; balances come from the position as at month-end. Nothing
// here is stored — it is recomputed from transactions on every render, so it
// can never drift from the ledger the way a hand-saved record could.
const deriveRecord = (monthLabel, registry, opening, txns, categories) => {
  const start = monthStartISO(monthLabel), end = monthEndISO(monthLabel);
  const activeExpense = (categories.expense || []).filter(c => !c.archived);
  const activeIncome = (categories.income || []).filter(c => !c.archived);
  const blank = cats => Object.fromEntries(cats.map(c => [c.key,
    c.subcats && c.subcats.length ? Object.fromEntries(c.subcats.map(s => [s.key, 0])) : 0]));
  const income = blank(activeIncome);
  const expenses = {
    fixedNonFinancial: blank(activeExpense.filter(c => c.group === "fixedNonFinancial")),
    fixedFinancial: blank(activeExpense.filter(c => c.group === "fixedFinancial")),
    variable: blank(activeExpense.filter(c => c.group === "variable"))
  };
  const add = (bucket, catKey, subKey, amt) => {
    if (!bucket || bucket[catKey] === undefined) return;
    if (bucket[catKey] && typeof bucket[catKey] === "object") {
      if (subKey && bucket[catKey][subKey] !== undefined) bucket[catKey][subKey] += amt;
      else {
        const first = Object.keys(bucket[catKey])[0];
        if (first) bucket[catKey][first] += amt;
      }
    } else bucket[catKey] += amt;
  };
  const known = new Set(registry.map(a => a.key));
  (txns || []).forEach(t => {
    if (t.voided || !t.date || t.date < start || t.date > end) return;
    // If the account was deleted the balance side is already dropped, so the
    // P&L side must be dropped too or the two statements disagree.
    if (!known.has(t.account)) return;
    const e = txnEffect(t, categories);
    if (e.kind === "income") add(income, t.category, t.subcat, e.amount);
    else if (e.kind === "expense") {
      const c = activeExpense.find(x => x.key === t.category);
      if (c) add(expenses[c.group], t.category, t.subcat, e.amount);
    }
  });
  const closing = computeBalances(registry, opening, txns, end);
  const balances = JSON.parse(JSON.stringify(BLANK_BALANCES));
  registry.forEach(a => {
    if (!balances[a.group]) balances[a.group] = {};
    balances[a.group][a.ref] = Math.round((closing[a.key] || 0) * 100) / 100;
  });
  return { month: monthLabel, income, expenses, balances, derived: true };
};

// History tab's Annual view: flow metrics (income/expenses/cashflow) sum across every month
// in the year, but balance-sheet metrics (liquid cash, investments, CPF, net worth, buffer)
// are a point-in-time snapshot, not a sum — summing twelve month-end balances would be
// meaningless, so each year takes its latest month that actually has balances instead.
// Records arrive pre-sorted chronologically, so the last hasBalances month seen per year is
// that year's most recent. Returns the same field shape as computeDerived's output, so the
// History table renders monthly and annual rows through identical row-formatter code.
const aggregateAnnual = (records, derivedByMonth) => {
  const byYear = {};
  (records || []).forEach(r => {
    const year = r.month.split(" ")[1];
    const d = derivedByMonth[r.month];
    if (!d) return;
    if (!byYear[year]) byYear[year] = { year, totalIncome: 0, totalExpenses: 0, netCashflow: 0, snapshot: null };
    const acc = byYear[year];
    acc.totalIncome += d.totalIncome;
    acc.totalExpenses += d.totalExpenses;
    acc.netCashflow += d.netCashflow;
    if (d.hasBalances) acc.snapshot = d;
  });
  return Object.values(byYear)
    .sort((a, b) => Number(a.year) - Number(b.year))
    .map(acc => ({
      year: acc.year,
      totalIncome: acc.totalIncome,
      totalExpenses: acc.totalExpenses,
      netCashflow: acc.netCashflow,
      hasBalances: !!acc.snapshot,
      totalLiquidCash: acc.snapshot ? acc.snapshot.totalLiquidCash : 0,
      totalInvestments: acc.snapshot ? acc.snapshot.totalInvestments : 0,
      combinedCpf: acc.snapshot ? acc.snapshot.combinedCpf : 0,
      netWorth: acc.snapshot ? acc.snapshot.netWorth : 0,
      bufferProgress: acc.snapshot ? acc.snapshot.bufferProgress : 0
    }));
};
// Shared by the History table's monthly and annual views — [label, raw-value getter (null
// when not applicable), display formatter]. Kept separate from a formatted-string getter (the
// table used to have) so the variance column can do real arithmetic on the raw number.
const HISTORY_ROWS = [
  ["Total income", d => d.totalIncome, fmt],
  ["Total expenses", d => d.totalExpenses, fmt],
  ["Net cashflow", d => d.netCashflow, fmt],
  ["Liquid cash", d => d.hasBalances ? d.totalLiquidCash : null, fmt],
  ["Investments", d => d.hasBalances ? d.totalInvestments : null, fmt],
  ["CPF combined", d => d.hasBalances ? d.combinedCpf : null, fmt],
  ["Net worth", d => d.hasBalances ? d.netWorth : null, fmt],
  ["Emergency buffer %", d => d.hasBalances ? d.bufferProgress : null, fmtPct]
];

const downloadBlob = (content, filename, mime) => {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* ══════════════════════════════════════════════════════════════════
   FIRST-RUN IMPORT — parsing + matching helpers
   Deliberately source-agnostic: nothing here is keyed to any one
   export app's column names or category vocabulary. Every guess made
   below is only ever a pre-filled default in SetupWizard's UI — the
   user always sees a real <select>/<input> and can override it.
   ══════════════════════════════════════════════════════════════════ */

// Reads any workbook the already-loaded xlsx.full.min.js can parse (.xls/.xlsx/.csv),
// auto-selecting the sheet with the most non-blank data rows (skips an empty "Debts"-
// style second sheet automatically) rather than prompting for a sheet up front.
const parseImportWorkbook = arrayBuffer => {
  if (typeof XLSX === "undefined") return null;
  const wb = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
  let best = null;
  wb.SheetNames.forEach(name => {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" });
    const headers = (aoa[0] || []).map(h => String(h == null ? "" : h).trim());
    const rows = aoa.slice(1).filter(r => r.some(c => c !== "" && c != null));
    if (!best || rows.length > best.rows.length) best = { sheetName: name, headers, rows };
  });
  return best;
};

const pad2 = n => String(n).padStart(2, "0");

// Matches numeric a/b/c dates with any of . / - as separator. Deliberately narrow —
// just the shape that's genuinely common (and genuinely ambiguous between countries)
// in tabular exports, not a general-purpose date parser.
const NUMERIC_DATE_RE = /^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/;

// A date column is ambiguous (DD/MM vs MM/DD) only when some value's first two
// components could each be either a day or a month (both <=12) AND the year is the
// third component — "2026/07/31" is never ambiguous, "03/04/2026" always is. Checked
// once per column so the wizard can ask a single question instead of guessing per row.
const isDateColumnAmbiguous = values => values.some(v => {
  const m = String(v == null ? "" : v).trim().match(NUMERIC_DATE_RE);
  if (!m) return false;
  const [, a, b, c] = m;
  if (a.length === 4 || c.length !== 4) return false;
  return Number(a) >= 1 && Number(a) <= 12 && Number(b) >= 1 && Number(b) <= 12;
});

// formatHint: "DMY" or "MDY" (default) — only consulted for the ambiguous a/b/YYYY shape;
// a value where one component is unambiguously >12 self-corrects regardless of the hint.
const parseFlexibleDate = (v, formatHint) => {
  if (v == null || v === "") return null;
  if (v instanceof Date) {
    if (isNaN(v.getTime())) return null;
    return `${v.getFullYear()}-${pad2(v.getMonth() + 1)}-${pad2(v.getDate())}`;
  }
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(NUMERIC_DATE_RE);
  if (m) {
    const [, a, b, c] = m;
    if (a.length === 4) return `${a}-${pad2(b)}-${pad2(c)}`;
    const year = c.length === 4 ? c : pad2(c);
    const yearFull = c.length === 4 ? c : `20${year}`;
    let [month, day] = formatHint === "DMY" ? [b, a] : [a, b];
    if (Number(month) > 12) [month, day] = [day, month];
    return `${yearFull}-${pad2(month)}-${pad2(day)}`;
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  return null;
};

const parseFlexibleAmount = v => {
  if (v == null || v === "") return null;
  if (typeof v === "number") return isNaN(v) ? null : v;
  let s = String(v).trim();
  if (!s) return null;
  const negParen = /^\(.*\)$/.test(s);
  if (negParen) s = s.slice(1, -1);
  s = s.replace(/[^0-9.\-]/g, "");
  if (!s || s === "-" || s === ".") return null;
  const n = Number(s);
  if (isNaN(n)) return null;
  return negParen ? -Math.abs(n) : n;
};

// Ordered, most-specific-first keyword lists per target field, tried exact-match-first
// across every header, then startsWith, then includes. Each header can only be claimed
// once, so e.g. "custom_category" never also satisfies plain "category" once the real
// "category" header has already matched. Debit/credit are checked before the generic
// "amount" so a bank-style export with both a plain Amount column and separate
// Debit/Credit columns still resolves sensibly either way.
const COLUMN_FIELD_KEYWORDS = [
  ["date", ["date"]],
  ["debit", ["debit", "withdrawal", "money out", "paid out", "outflow"]],
  ["credit", ["credit", "deposit", "money in", "paid in", "inflow"]],
  ["amount", ["amount", "value", "sum"]],
  ["type", ["type", "direction"]],
  ["account", ["account", "wallet", "source"]],
  ["category", ["category"]],
  ["payee", ["payee", "merchant", "vendor", "description"]],
  ["note", ["note", "memo", "notes", "comment"]]
];

const guessColumnMap = headers => {
  const claimed = new Set();
  const norm = h => String(h || "").trim().toLowerCase();
  const map = {};
  COLUMN_FIELD_KEYWORDS.forEach(([field, keywords]) => {
    let found = null;
    for (const pass of ["exact", "startsWith", "includes"]) {
      if (found) break;
      for (const kw of keywords) {
        const hit = headers.find(h => !claimed.has(h) &&
          (pass === "exact" ? norm(h) === kw : pass === "startsWith" ? norm(h).startsWith(kw) : norm(h).includes(kw)));
        if (hit) { found = hit; break; }
      }
    }
    if (found) { map[field] = found; claimed.add(found); }
  });
  return map;
};

const normalizeForMatch = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");

// Best-effort string similarity only — deliberately not a hardcoded synonym table (no
// baked-in "Eat Out -> F&B" style rule). That kind of table quietly encodes one source
// app's vocabulary; every non-obvious mapping stays the user's explicit call.
const fuzzyLabelMatch = (value, existingItems) => {
  const target = normalizeForMatch(value);
  if (!target) return null;
  const exact = existingItems.find(it => normalizeForMatch(it.label) === target);
  if (exact) return exact;
  return existingItems.find(it => {
    const n = normalizeForMatch(it.label);
    return n && (target.includes(n) || n.includes(target));
  }) || null;
};

const CATEGORY_SPLIT_DELIMS = [":", "/", ">"];

// Looks for one delimiter that splits a clear majority of distinct category values into
// exactly two non-empty parts — a real "Group: Category" hierarchy, not a category that
// just happens to contain a colon once. Returns the delimiter, or null.
const detectCategoryDelimiter = distinctValues => {
  if (!distinctValues.length) return null;
  let bestDelim = null, bestScore = 0;
  CATEGORY_SPLIT_DELIMS.forEach(delim => {
    const hits = distinctValues.filter(v => {
      const parts = String(v || "").split(delim);
      return parts.length === 2 && parts[0].trim() && parts[1].trim();
    }).length;
    if (hits > bestScore) { bestScore = hits; bestDelim = delim; }
  });
  return bestScore >= Math.max(2, Math.ceil(distinctValues.length * 0.6)) ? bestDelim : null;
};

const splitCategoryValue = (value, delim) => {
  const parts = String(value || "").split(delim);
  return parts.length === 2
    ? { group: parts[0].trim(), sub: parts[1].trim() }
    : { group: String(value || "").trim(), sub: "" };
};

const EXPENSE_TYPE_HINTS = ["expense", "debit", "outflow", "withdrawal", "spend", "paid out"];
const INCOME_TYPE_HINTS = ["income", "credit", "inflow", "deposit", "earn", "paid in"];

// null = ambiguous, the wizard asks the user once per distinct value.
const inferTypeFromValue = raw => {
  const v = String(raw || "").trim().toLowerCase();
  if (!v) return null;
  if (EXPENSE_TYPE_HINTS.some(h => v.includes(h))) return "expense";
  if (INCOME_TYPE_HINTS.some(h => v.includes(h))) return "income";
  return null;
};

// Deterministic FNV-1a hash over a row's raw source values (not the mapped/parsed
// result) — used only so an accidental double-submit of "Confirm import" can't create
// duplicate transactions (same id -> same Firestore doc -> overwrite, not a duplicate).
const hashRow = rawRowArray => {
  const str = rawRowArray.map(v => v instanceof Date ? v.toISOString() : String(v == null ? "" : v)).join("");
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(16);
};

function ReconcileDialog({ account, computed, onCancel, onConfirm, categories }) {
  const [actual, setActual] = useState(computed);

  // Which way the difference points decides which side of the books it
  // belongs on: an asset that grew, or a liability that shrank, is a gain.

  const pool = ((favourable ? categories.income : categories.expense) || []).filter(c => !c.archived);
  return rc("div", {

    }
  }, rc("div", {
    onClick: e => e.stopPropagation(),
    style: { background: "#fff", borderRadius: 10, padding: 22, width: 420, maxWidth: "92vw" }
  },
    rc("div", { style: { fontFamily: "var(--serif)", fontSize: 19, color: "var(--ink-1)", marginBottom: 4 } },
      "Adjust balance"),
    rc("div", { style: { fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-3)", marginBottom: 16 } },
      account.label),
    rc("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 } },
      rc("div", null,
        rc(LedgerLabel, null, "Ledger says"),
        rc("div", { style: { fontFamily: "var(--mono)", fontSize: 15, color: "var(--ink-2)", padding: "7px 0" } },
          fmt(computed, 2))
      ),
      rc("div", null,
        rc(LedgerLabel, null, "Actual balance"),
        rc("input", {
          type: "number", step: "0.01", value: actual,
          onFocus: e => e.target.select(),
          onChange: e => setActual(e.target.value === "" ? 0 : parseFloat(e.target.value)),
          style: { ...inputStyle, fontFamily: "var(--mono)" }
        })
      )
    ),
    rc("div", { style: { marginBottom: 12 } },
      rc(LedgerLabel, null, "Date of adjustment"),
      rc("input", { type: "date", value: date, onChange: e => setDate(e.target.value), style: inputStyle })
    ),
    rc("div", { style: { marginBottom: 16 } },
      rc(LedgerLabel, null, "Reason (optional)"),
      rc("input", {
        type: "text", value: note, placeholder: "e.g. bank interest, missed entry",
        onChange: e => setNote(e.target.value), style: inputStyle
      })
    ),
    Math.abs(diff) >= 0.005 && rc("div", { style: { marginBottom: 16 } },
      rc(LedgerLabel, null, "Book the difference as"),
      rc("select", { value: counterCat, onChange: e => setCounterCat(e.target.value), style: inputStyle },
        rc("option", { value: "" }, "Unexplained \u2014 don't count it as income or spending"),
        rc("optgroup", { label: favourable ? "Count as income" : "Count as expense" },
          pool.map(c => rc("option", { key: c.key, value: c.key }, (c.icon ? c.icon + " " : "") + c.label)))),
      rc("div", { style: { fontFamily: "var(--sans)", fontSize: 11, color: "var(--ink-3)", marginTop: 4 } },
        favourable
          ? "Use this for investment gains, CPF interest or cashback so they show up as income."
          : "Use this for market losses or fees so they show up as spending.")),
    rc("div", {
      style: {
        background: Math.abs(diff) < 0.005 ? "#F3F2EE" : "#FBF3E6",
        border: "1px solid var(--hair)", borderRadius: 8, padding: 12, marginBottom: 16,
        fontFamily: "var(--sans)", fontSize: 12.5, color: "var(--ink-2)"
      }
    }, Math.abs(diff) < 0.005
      ? "No difference — nothing will be recorded."
      : `A ${diff > 0 ? "increase" : "decrease"} of ${fmt(Math.abs(diff), 2)} will be written to the ledger as a balance adjustment entry.`),
    rc("div", { style: { display: "flex", gap: 8, justifyContent: "flex-end" } },
      rc("button", { className: "btn-secondary", onClick: onCancel }, "Cancel"),
      rc("button", {
        className: "btn-primary",
        disabled: Math.abs(diff) < 0.005,
        onClick: () => onConfirm({ storedDelta: diff, note, date, category: counterCat || "balanceAdjustment" })
      }, "Record adjustment")
    )
  ));
}

/* ───────────── first-run setup wizard ───────────── */

// Tracker shows 5 stages, not the 6 internal step values — "welcome" (file picker)
// and "mapping" (column mapping) are both part of one visible "Import" stage so the
// tracker doesn't get crowded with two bubbles for what's really one file-upload flow.
const SETUP_TRACKER_STAGES = ["Import", "Account mapping", "Categories mapping", "Review", "Balances"];
const SETUP_STEP_GROUP = { welcome: 0, mapping: 0, accounts: 1, categories: 2, preview: 3, balances: 4 };
const SETUP_STEP_COPY = {
  welcome: { title: "Import", instruction: "Upload a file to bring in historical transactions, or start fresh." },
  mapping: { title: "Import", instruction: "Match each column in your file to what QddFi needs." },
  accounts: { title: "Account mapping", instruction: "Match each account found in your file to one of yours, or create a new one." },
  categories: { title: "Categories mapping", instruction: "Match each category found in your file to one of yours, or create a new one." },
  preview: { title: "Review", instruction: "Check the counts and preview, then confirm to import." },
  balances: { title: "Balances", instruction: "Enter what each account actually holds today." }
};

function SetupWizard({
  registry, categories, accounts, familyMembers, txns, liveBalances,
  onSaveTxn, onReconcileAccount, persistAll, onClose, onFinish
}) {
  const [step, setStep] = useState("welcome");
  const [parsed, setParsed] = useState(null);
  const [parseError, setParseError] = useState("");
  const [columnMap, setColumnMap] = useState({});
  const [amountMode, setAmountMode] = useState("single");
  const [negativeIsExpense, setNegativeIsExpense] = useState(true);
  const [dateFormatHint, setDateFormatHint] = useState("MDY");
  const [typeValueMap, setTypeValueMap] = useState({});
  const [categorySplitEnabled, setCategorySplitEnabled] = useState(false);
  const [accountMap, setAccountMap] = useState({});
  // Raw account value -> user-typed rename for a newly-created account. Defaults to the
  // imported value itself (see accounts-step render) — just lets the user confirm or
  // override that default before anything is written.
  const [accountNameInputs, setAccountNameInputs] = useState({});
  const [categoryMap, setCategoryMap] = useState({});
  // Raw category value -> "expense"/"income" override — lets the user decide which
  // umbrella a category belongs to independent of what the source file's Type column
  // or amount sign said any given row was (see effectiveCategoryType below).
  const [categoryTypeMap, setCategoryTypeMap] = useState({});
  const [subInputs, setSubInputs] = useState({});
  // Raw category value -> user-typed rename for a newly-created category, same
  // default-then-override pattern as accountNameInputs above.
  const [catNameInputs, setCatNameInputs] = useState({});
  // Casing/whitespace-only collisions between two category or subcategory names (e.g.
  // "Dining" vs "dining", or a typed "food" vs the real "Food" category) are never
  // auto-merged — each is resolved once via a popup (see plan.pendingCaseConfirm below)
  // and recorded here as "merge" or "separate", keyed so a decision naturally goes stale
  // if the user edits the colliding text again.
  const [categoryCaseDecisions, setCategoryCaseDecisions] = useState({});
  const [subcatCaseDecisions, setSubcatCaseDecisions] = useState({});
  // Raw category value -> whether its "peek at real rows" panel is expanded. Collapsed
  // by default (same pattern as Filters/Loan events elsewhere) so a file with dozens of
  // categories doesn't turn the mapping step into a wall of sample data.
  const [previewOpenFor, setPreviewOpenFor] = useState({});
  const [importSummary, setImportSummary] = useState(null);
  const [balanceInputs, setBalanceInputs] = useState({});
  const [asOfDate, setAsOfDate] = useState(todayISO());
  // Raw account-group key -> typed name for the Balances step's own "+ Add account" —
  // households start with zero seeded accounts (see seedAccounts), so a "Start fresh, no
  // import" run needs some way to actually create the first one instead of landing on an
  // empty step with nothing to enter a balance for.
  const [newAccountName, setNewAccountName] = useState({});
  const [busy, setBusy] = useState(false);
  // Count of transactions actually attempted so far during confirmImport — drives the
  // Preview step's progress bar so a large import doesn't look stuck.
  const [importProgress, setImportProgress] = useState(0);

  const setCol = (field, value) => setColumnMap(m => ({ ...m, [field]: value }));

  const onFile = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setParseError("");
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const result = parseImportWorkbook(ev.target.result);
        if (!result || !result.rows.length) {
          setParseError("Couldn't find any data rows in that file.");
          return;
        }
        const guess = guessColumnMap(result.headers);
        setParsed(result);
        setColumnMap(guess);
        setAmountMode((guess.debit || guess.credit) && !guess.amount ? "debitCredit" : "single");
        setTypeValueMap({});
        setAccountMap({});
        setAccountNameInputs({});
        setCategoryMap({});
        setCategoryTypeMap({});
        setCatNameInputs({});
        setCategoryCaseDecisions({});
        setSubcatCaseDecisions({});
        setStep("mapping");
      } catch (err) {
        console.error(err);
        setParseError("Couldn't read that file — check it's a valid CSV/XLS/XLSX export.");
      }
    };
    reader.readAsArrayBuffer(f);
  };

  const dateAmbiguous = useMemo(() => {
    if (!parsed || !columnMap.date) return false;
    const idx = parsed.headers.indexOf(columnMap.date);
    if (idx < 0) return false;
    return isDateColumnAmbiguous(parsed.rows.map(r => r[idx]));
  }, [parsed, columnMap.date]);

  const intermediateRows = useMemo(() => {
    if (!parsed) return [];
    const idx = h => (h ? parsed.headers.indexOf(h) : -1);
    const dateIdx = idx(columnMap.date);
    const amountIdx = idx(columnMap.amount);
    const debitIdx = idx(columnMap.debit);
    const creditIdx = idx(columnMap.credit);
    const typeIdx = idx(columnMap.type);
    const accountIdx = idx(columnMap.account);
    const categoryIdx = idx(columnMap.category);
    const payeeIdx = idx(columnMap.payee);
    const noteIdx = idx(columnMap.note);
    return parsed.rows.map((row, i) => {
      const date = dateIdx >= 0 ? parseFlexibleDate(row[dateIdx], dateFormatHint) : null;
      let amountAbs = null, isExpense = null;
      if (amountMode === "debitCredit") {
        const d = debitIdx >= 0 ? parseFlexibleAmount(row[debitIdx]) : null;
        const c = creditIdx >= 0 ? parseFlexibleAmount(row[creditIdx]) : null;
        if (d) { amountAbs = Math.abs(d); isExpense = true; }
        else if (c) { amountAbs = Math.abs(c); isExpense = false; }
      } else {
        const raw = amountIdx >= 0 ? parseFlexibleAmount(row[amountIdx]) : null;
        if (raw != null) {
          amountAbs = Math.abs(raw);
          if (typeIdx >= 0) {
            const rawType = String(row[typeIdx] ?? "").trim();
            const override = typeValueMap[rawType];
            const inferred = inferTypeFromValue(rawType);
            if (override === "skip") isExpense = "skip";
            else if (override) isExpense = override === "expense";
            else if (inferred) isExpense = inferred === "expense";
            else isExpense = null;
          } else {
            isExpense = negativeIsExpense ? raw < 0 : raw >= 0;
          }
        }
      }
      return {
        rowIndex: i,
        raw: row,
        date,
        amountAbs,
        isExpense,
        accountRaw: accountIdx >= 0 ? (String(row[accountIdx] ?? "").trim() || "__ALL__") : "__ALL__",
        categoryRaw: categoryIdx >= 0 ? String(row[categoryIdx] ?? "").trim() : "",
        payeeRaw: payeeIdx >= 0 ? String(row[payeeIdx] ?? "").trim() : "",
        noteRaw: noteIdx >= 0 ? String(row[noteIdx] ?? "").trim() : ""
      };
    });
  }, [parsed, columnMap, amountMode, negativeIsExpense, dateFormatHint, typeValueMap]);

  const distinctTypeValues = useMemo(() => {
    if (amountMode !== "single" || !columnMap.type || !parsed) return [];
    const idx = parsed.headers.indexOf(columnMap.type);
    if (idx < 0) return [];
    const seen = new Map();
    parsed.rows.forEach(r => {
      const v = String(r[idx] ?? "").trim();
      if (!v) return;
      seen.set(v, (seen.get(v) || 0) + 1);
    });
    return [...seen.entries()].map(([value, count]) => ({ value, count, inferred: inferTypeFromValue(value) }));
  }, [amountMode, columnMap.type, parsed]);

  const ambiguousTypeValues = distinctTypeValues.filter(t => !t.inferred && !typeValueMap[t.value]);

  const distinctAccounts = useMemo(() => {
    const m = new Map();
    intermediateRows.forEach(r => {
      if (!r.accountRaw) return;
      m.set(r.accountRaw, (m.get(r.accountRaw) || 0) + 1);
    });
    return [...m.entries()].map(([value, count]) => ({ value, count }));
  }, [intermediateRows]);

  const categoryValuesRaw = useMemo(
    () => [...new Set(intermediateRows.map(r => r.categoryRaw).filter(Boolean))],
    [intermediateRows]
  );
  const categoryDelimiter = useMemo(() => detectCategoryDelimiter(categoryValuesRaw), [categoryValuesRaw]);

  // One entry per distinct raw category value regardless of which type its rows
  // resolved to — a category can genuinely appear as both (e.g. "Food" mostly expense
  // rows plus a few refunds the source file flagged as income). expenseCount/incomeCount
  // drive the default target type (majority wins); effectiveCategoryType lets the user
  // override it per value, so the source file's per-row direction never forces which of
  // the household's own categories (or which pool) an imported category lands in.
  const distinctCategories = useMemo(() => {
    const m = new Map();
    intermediateRows.forEach(r => {
      if (r.isExpense !== true && r.isExpense !== false) return;
      if (!r.categoryRaw) return;
      const entry = m.get(r.categoryRaw) || { value: r.categoryRaw, expenseCount: 0, incomeCount: 0 };
      if (r.isExpense) entry.expenseCount++; else entry.incomeCount++;
      m.set(r.categoryRaw, entry);
    });
    return [...m.values()];
  }, [intermediateRows]);

  const naturalCategoryType = entry => entry.expenseCount >= entry.incomeCount ? "expense" : "income";
  const effectiveCategoryType = value => {
    if (categoryTypeMap[value]) return categoryTypeMap[value];
    const entry = distinctCategories.find(e => e.value === value);
    return entry ? naturalCategoryType(entry) : "expense";
  };

  // Raw category value -> its actual source rows (file order), so the Categories step can
  // show a "peek at real rows" sample without re-scanning intermediateRows per category
  // on every render.
  const categoryRowsIndex = useMemo(() => {
    const idx = new Map();
    intermediateRows.forEach(r => {
      if (!r.categoryRaw) return;
      if (!idx.has(r.categoryRaw)) idx.set(r.categoryRaw, []);
      idx.get(r.categoryRaw).push(r);
    });
    return idx;
  }, [intermediateRows]);

  const accountPool = useMemo(
    () => registry.filter(a => a.group === "liquidCash" || a.group === "investments" || a.group === "property"),
    [registry]
  );

  const effectiveAccountMapping = value => {
    if (accountMap[value]) return accountMap[value];
    const match = fuzzyLabelMatch(value === "__ALL__" ? "" : value, accountPool);
    return match ? { action: "existing", key: match.key } : { action: "createLiquid", key: null };
  };

  const effectiveCategoryMapping = rawValue => {
    if (categoryMap[rawValue]) return categoryMap[rawValue];
    const pool = categories[effectiveCategoryType(rawValue)].filter(c => !c.archived);
    const lookupLabel = categorySplitEnabled && categoryDelimiter
      ? splitCategoryValue(rawValue, categoryDelimiter).group
      : rawValue;
    const match = fuzzyLabelMatch(lookupLabel, pool);
    return match ? { action: "existing", key: match.key, subKey: "" } : { action: "create", key: null, subKey: "" };
  };

  const plan = useMemo(() => {
    const newAccountsByGroup = { liquidCash: [], investments: [], property: [] };
    const resolvedAccountKey = {};
    // Lets two raw account values that resolve to the same "create new" name AND the same
    // create action (e.g. two mis-spelled source accounts both renamed "HSBC Savings")
    // merge into one new account instead of creating duplicates — keyed by action +
    // case/whitespace-normalized label so an "HSBC" liquid-cash create never merges with
    // an unrelated "HSBC" credit-card create.
    const newAccountByLabel = new Map();
    distinctAccounts.forEach(({ value }) => {
      const m = effectiveAccountMapping(value);
      if (m.action === "skip") { resolvedAccountKey[value] = null; return; }
      if (m.action === "existing") { resolvedAccountKey[value] = m.key; return; }
      const importedName = value === "__ALL__" ? "Imported account" : value;
      const label = (accountNameInputs[value] || "").trim() || importedName;
      const normLabel = label.trim().toLowerCase();
      // A typed/renamed "create new" name might exactly match an account the household
      // already has — reuse that real account instead of creating a same-named duplicate.
      // Scoped to the same kind of account the create action would have produced (liquid
      // cash/investments/a property-group liability) so a rename never silently merges
      // into an unrelated real account that just happens to share a label.
      const realGroupMatch = m.action === "createCreditCard"
        ? accountPool.find(a => a.group === "property" && a.kind === "liability" && a.label.trim().toLowerCase() === normLabel)
        : accountPool.find(a => a.group === (m.action === "createInvest" ? "investments" : "liquidCash") && a.label.trim().toLowerCase() === normLabel);
      if (realGroupMatch) { resolvedAccountKey[value] = realGroupMatch.key; return; }
      const labelKey = `${m.action}|${normLabel}`;
      const existingNew = newAccountByLabel.get(labelKey);
      if (existingNew) { resolvedAccountKey[value] = existingNew; return; }
      const key = `acct_${uid()}`;
      // registry keys are "<group>.<raw key>" (buildRegistry, index.html) — resolvedAccountKey
      // feeds straight into each transaction's `account` field, so it must match that prefixed
      // form, not the raw key stored in accounts[group][].key, or the transaction ends up
      // pointing at nothing once this new account is merged in and re-derived into registry.
      let resolvedKey;
      if (m.action === "createCreditCard") {
        newAccountsByGroup.property.push({ key, label, type: "liability", shortTermLiability: true, mortgage: false, owner: "Joint" });
        resolvedKey = `property.${key}`;
      } else {
        const group = m.action === "createInvest" ? "investments" : "liquidCash";
        newAccountsByGroup[group].push({ key, label, owner: "Joint" });
        resolvedKey = `${group}.${key}`;
      }
      resolvedAccountKey[value] = resolvedKey;
      newAccountByLabel.set(labelKey, resolvedKey);
    });

    const newCategoriesByType = { expense: [], income: [] };
    // Subcats to append onto an EXISTING category (keyed by that category's own key) — a
    // brand-new category being created in this same pass instead gets its subcat pushed
    // straight into its own `subcats` array below, no separate bucket needed for that case.
    const categorySubAdditions = {};
    // Lets two raw category values that resolve to the same "create new" name (e.g. two
    // mis-spelled source categories both renamed "Food") merge into one new category
    // instead of creating duplicates — keyed by type + case/whitespace-normalized label,
    // populated as each "create" row below is resolved. Always keeps the FIRST-seen
    // spelling even once a later, differently-cased row is confirmed to merge into it —
    // every subsequent variant is compared against that same first one, never the most
    // recent, so the popup below always reads "same as «first spelling»?".
    const newCategoryByLabel = new Map();
    // Keyed by raw category value only now (not type|value) — a value has exactly one
    // target category, and that target's own type (carried alongside key/subKey here)
    // is what a row's written transaction type follows, not the row's source direction.
    const resolvedCategory = {};
    // Casing/whitespace-only collisions (category or subcategory) are never auto-merged —
    // each is queued here as the next question for the user, one at a time, and the row
    // that triggered it defaults to "keep separate" until a decision exists. Whichever
    // collision is found FIRST while walking the rows below wins for this render; once
    // it's resolved (categoryCaseDecisions/subcatCaseDecisions), the next render either
    // finds the next one or none.
    let pendingCaseConfirm = null;
    const queuePending = info => { if (!pendingCaseConfirm) pendingCaseConfirm = info; };
    // Exact text match (no ambiguity) vs. same-once-normalized-but-differently-spelled
    // match (needs a decision before use) — used for both category and subcategory names.
    const findLabelMatch = (label, pool, normalize) => {
      const exact = pool.find(c => c.label === label);
      if (exact) return { match: exact, needsConfirm: false };
      const norm = normalize(label);
      const caseOnly = pool.find(c => normalize(c.label) === norm);
      return caseOnly ? { match: caseOnly, needsConfirm: true } : { match: null, needsConfirm: false };
    };
    const normCat = s => s.trim().toLowerCase();
    // Shared by all three "does this subcategory already exist here" checks below (an
    // existing real category, a real category matched via rename, or a category this
    // same import already queued) — reuses a matched subcat's key, mints a new one, or
    // (for a casing-only match still awaiting a decision) queues the popup and mints a
    // new one anyway for now, same "default to separate until confirmed" rule as above.
    // A genuinely fuzzy SUBSTRING match (e.g. "Food" vs "Foods", fuzzyLabelMatch's own
    // fallback tier) is untouched by any of this and keeps its existing silent behavior —
    // only a pure casing/punctuation/whitespace difference is gated behind a popup.
    const resolveSubKey = (subRaw, subcatsList, decisionKey) => {
      if (!subRaw) return { subKey: "", newSub: null };
      const list = subcatsList || [];
      const { match, needsConfirm } = findLabelMatch(subRaw, list, normalizeForMatch);
      if (match && !needsConfirm) return { subKey: match.key, newSub: null };
      if (match && needsConfirm) {
        const decision = subcatCaseDecisions[decisionKey];
        if (decision === "merge") return { subKey: match.key, newSub: null };
        if (decision !== "separate") queuePending({ kind: "subcat", decisionKey, firstLabel: match.label, thisLabel: subRaw });
      } else {
        const fuzzy = fuzzyLabelMatch(subRaw, list);
        if (fuzzy) return { subKey: fuzzy.key, newSub: null };
      }
      const subKey = `sub_${uid()}`;
      return { subKey, newSub: { key: subKey, label: subRaw } };
    };
    distinctCategories.forEach(({ value }) => {
      const type = effectiveCategoryType(value);
      const m = effectiveCategoryMapping(value);
      if (m.action === "skip") { resolvedCategory[value] = null; return; }
      const split = categorySplitEnabled && categoryDelimiter
        ? splitCategoryValue(value, categoryDelimiter)
        : { group: value, sub: "" };
      // A typed subInput always wins over the delimiter-derived guess — the input field
      // itself is pre-filled from split.sub, so leaving it alone still uses the guess.
      const subRaw = (subInputs[value] !== undefined ? subInputs[value] : split.sub || "").trim();
      if (m.action === "existing") {
        const targetCat = categories[type].find(c => c.key === m.key);
        // Pool includes subcats this same import already staged onto this category (an
        // earlier raw value hitting the same target) — checking only the persisted
        // targetCat.subcats would miss those and mint a second, differently-cased
        // duplicate for what should be one shared subcat.
        const stagedSubs = categorySubAdditions[m.key] || [];
        const { subKey, newSub } = resolveSubKey(subRaw, [...(targetCat ? targetCat.subcats || [] : []), ...stagedSubs], `cat:${m.key}|${value}`);
        if (newSub) (categorySubAdditions[m.key] = stagedSubs).push(newSub);
        resolvedCategory[value] = { type, key: m.key, subKey };
        return;
      }
      const catLabel = (catNameInputs[value] || "").trim() || split.group;

      // A typed/renamed "create new" label might match a category the household already
      // has — reuse that real category instead of creating a same-named duplicate, same
      // principle as the two branches above/below. Archived categories are excluded,
      // same as the target-category dropdown/fuzzy-match pool elsewhere in this wizard —
      // an archived category is never a valid merge target through the UI. An exact-text
      // match merges silently; a casing/whitespace-only match needs a decision first.
      const realPool = categories[type].filter(c => !c.archived);
      const realFind = findLabelMatch(catLabel, realPool, normCat);
      let realMatch = realFind.match;
      if (realMatch && realFind.needsConfirm) {
        const decisionKey = `cat:${value}|real:${realMatch.key}`;
        const decision = categoryCaseDecisions[decisionKey];
        if (decision !== "merge") {
          if (decision !== "separate") queuePending({ kind: "category", decisionKey, firstLabel: realMatch.label, thisLabel: catLabel });
          realMatch = null;
        }
      }
      if (realMatch) {
        // Same staged-subs pool reasoning as the existing-category branch above — an
        // earlier raw value in this same import may have already queued a subcat here.
        const stagedSubs = categorySubAdditions[realMatch.key] || [];
        const { subKey, newSub } = resolveSubKey(subRaw, [...(realMatch.subcats || []), ...stagedSubs], `cat:${realMatch.key}|${value}`);
        if (newSub) (categorySubAdditions[realMatch.key] = stagedSubs).push(newSub);
        resolvedCategory[value] = { type, key: realMatch.key, subKey };
        return;
      }

      // Collision against a category this same import already queued to create (first-
      // seen spelling wins the map slot — see the comment on newCategoryByLabel above).
      const labelKey = `${type}|${normCat(catLabel)}`;
      let existingNew = newCategoryByLabel.get(labelKey);
      if (existingNew && existingNew.label !== catLabel) {
        const decisionKey = `cat:${value}|new:${labelKey}`;
        const decision = categoryCaseDecisions[decisionKey];
        if (decision !== "merge") {
          if (decision !== "separate") queuePending({ kind: "category", decisionKey, firstLabel: existingNew.label, thisLabel: catLabel });
          existingNew = null;
        }
      }
      if (existingNew) {
        // Same reuse-or-append behavior as the branches above, just against a category
        // this same import already queued a moment ago instead of one already saved.
